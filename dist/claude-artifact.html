<script type="application/json" id="demo-data">{"label":"gotoken/cruby-formalized-trial @ 74e11c6（demo）","start":"lean/CrubyRange/Impl.lean","files":{"lean/CrubyRange/Impl.lean":"import CrubyRange.Basic\n\n/-!\n# Implementation models M_chk and M_wrap\n\nBoth follow `rb_range_component_beg_len` (range.c, ruby/ruby 1f2a4bd)\nstatement by statement; they differ only in how a `long` addition or\nsubtraction behaves.\n\n```c\n    beg = NIL_P(b) ? 0 : NUM2LEN(b);\n    end = NIL_P(e) ? -1 : NUM2LEN(e);\n    if (NIL_P(e)) excl = 0;\n    if (beg < 0) {\n        beg += len;\n        if (beg < 0)\n            goto out_of_range;\n    }\n    if (end < 0)\n        end += len;\n    if (!excl)\n        end++;\t\t\t/* include end point */\n    if (err == 0 || err == 2) {\n        if (beg > len)\n            goto out_of_range;\n        if (end > len)\n            end = len;\n    }\n    len = end - beg;\n    if (len < 0)\n        len = 0;\n```\n-/\n\nnamespace CrubyRange\n\n/-- `x` if it fits in `long`, otherwise `none` (signed overflow). -/\ndef checked (x : Int) : Option Int :=\n  if MIN ≤ x ∧ x ≤ MAX then some x else none\n\n/-- Two's-complement wrap-around to 64 bits. -/\ndef wrap64 (x : Int) : Int :=\n  (x - MIN) % (2 ^ 64) + MIN\n\n/-- The function body, parameterised by the result of each `long` `+`/`-`\n(`none` = overflow). Comments quote the C statements. -/\ndef body (arith : Int → Option Int) (i : Input) : ChkOut :=\n  -- beg = NIL_P(b) ? 0 : NUM2LEN(b);  end = NIL_P(e) ? -1 : NUM2LEN(e);\n  let beg0 := i.b.getD 0\n  let end0 := i.e.getD (-1)\n  -- if (NIL_P(e)) excl = 0;\n  let excl := i.e.isSome && i.excl\n  -- if (beg < 0) { beg += len; if (beg < 0) goto out_of_range; }\n  match (if beg0 < 0 then arith (beg0 + i.n) else some beg0) with\n  | none => .overflow\n  | some beg =>\n    if beg < 0 then .out else\n    -- if (end < 0) end += len;\n    match (if end0 < 0 then arith (end0 + i.n) else some end0) with\n    | none => .overflow\n    | some end1 =>\n      -- if (!excl) end++;\n      match (if excl then some end1 else arith (end1 + 1)) with\n      | none => .overflow\n      | some end2 =>\n        -- if (err == 0 || err == 2) { if (beg > len) goto out_of_range;\n        --                             if (end > len) end = len; }\n        let clip := i.err == 0 || i.err == 2\n        if clip && i.n < beg then .out else\n        let end3 := if clip && i.n < end2 then i.n else end2\n        -- len = end - beg; if (len < 0) len = 0;\n        match arith (end3 - beg) with\n        | none => .overflow\n        | some l => .ok beg (if l < 0 then 0 else l)\n\n/-- M_chk: every `long` operation is checked; leaving `[MIN, MAX]` gives\n`overflow`. Conservative with respect to the C semantics. -/\ndef mChk (i : Input) : ChkOut :=\n  body checked i\n\n/-- M_wrap: every `long` operation wraps around modulo 2^64. Matches the\ngenerated code only when `-fno-strict-overflow` is in effect (CRuby's\nconfigure adds it; checked with gcc 13 and clang 18); without it signed\noverflow is undefined behaviour and this model does not apply. Never returns\n`overflow`. -/\ndef mWrap (i : Input) : ChkOut :=\n  body (fun x => some (wrap64 x)) i\n\nend CrubyRange\n","lean/CrubyRange/Spec.lean":"import CrubyRange.Basic\n\n/-!\n# Specification S\n\nOver mathematical integers and independent of the statement order of the C\ncode. See `PROPERTIES.md` for the prose version.\n-/\n\nnamespace CrubyRange\n\n/-- Normalized start index B: negative values count from the end. -/\ndef specBeg (i : Input) : Int :=\n  let b := i.b.getD 0\n  if b < 0 then b + i.n else b\n\n/-- Normalized exclusive end E. An endless range ends at `n`; an inclusive\nrange ends one past its last index. -/\ndef specEnd (i : Input) : Int :=\n  match i.e with\n  | none   => i.n\n  | some e => (if e < 0 then e + i.n else e) + (if i.excl then 0 else 1)\n\n/-- Specification S: the intended interval, as mathematical integers.\n\n* `err ∈ {0,2}`: the selected indices are `[B, E) ∩ [0, n)`;\n  a start past the end is out of range.\n* `err = 1`: the interval `[B, E)` is not clipped at `n` (it may extend the\n  receiver).\n\nS always returns this mathematical interval. It does not model what should\nhappen when the interval does not fit in `long` (for `err = 1`, `len` or\n`B + len` above `LONG_MAX`); in particular it does not raise. Whether results\nare representable is examined separately (`P1_repr`, `P4`). -/\ndef spec (i : Input) : Out :=\n  let B := specBeg i\n  let E := specEnd i\n  if B < 0 then .out\n  else if i.err = 1 then .ok B (max (E - B) 0)\n  else if i.n < B then .out\n  else .ok B (max (min E i.n - B) 0)\n\nend CrubyRange\n","lean/CrubyRange/Statements.lean":"import CrubyRange.Spec\nimport CrubyRange.Impl\n\n/-!\n# Propositions P1–P4 (statements only)\n\nThese are `Prop` definitions, not theorems: they state exactly what is\nproved or refuted. The proofs are in `CrubyRange/Proofs.lean`.\nAll arithmetic and comparisons are over `Int` (no wrap-around).\n-/\n\nnamespace CrubyRange\n\n/-! ## P1: agreement with the specification (main goal) -/\n\n/-- Wherever M_chk does not overflow, it agrees with S. -/\ndef P1 : Prop :=\n  ∀ i : Input, i.Valid → mChk i ≠ .overflow → mChk i = (spec i).toChk\n\n/-- For `err ∈ {0,2}` the result of S always fits in `long`. -/\ndef P1_repr : Prop :=\n  ∀ i : Input, i.Valid → i.err ≠ 1 →\n    ∀ b l, spec i = .ok b l → MIN ≤ b ∧ b ≤ MAX ∧ MIN ≤ l ∧ l ≤ MAX\n\n/-! ## P3: arithmetic safety (main goal) -/\n\n/-- O1: `end++` at `LONG_MAX` (range.c:1925). -/\ndef O1 (i : Input) : Prop :=\n  0 ≤ specBeg i ∧ i.e = some MAX ∧ i.excl = false\n\n/-- O2 (err = 1 only): `end - beg` below `LONG_MIN` (range.c:1932). -/\ndef O2 (i : Input) : Prop :=\n  i.err = 1 ∧ 0 ≤ specBeg i ∧ specEnd i - specBeg i < MIN\n\n/-- M_chk overflows exactly on O1 and O2. -/\ndef P3 : Prop :=\n  ∀ i : Input, i.Valid → (mChk i = .overflow ↔ O1 i ∨ O2 i)\n\n/-- Corollary: for `err ∈ {0,2}`, an exclusive range or an end other than\n`LONG_MAX` never overflows. -/\ndef P3_safe : Prop :=\n  ∀ i : Input, i.Valid → i.err ≠ 1 → (i.e ≠ some MAX ∨ i.excl = true) →\n    mChk i ≠ .overflow\n\n/-! ## P2: saturation at the upper end (element reads only) -/\n\n/-- For `err = 0` and an inclusive range whose Integer end is at or past the\nlast index, the result equals that of the endless range. Stated for any model\n`f`; expected to hold for S and to fail for M_wrap at `e = LONG_MAX`. -/\ndef P2 (f : Input → ChkOut) : Prop :=\n  ∀ i : Input, i.Valid → i.err = 0 → i.excl = false →\n    ∀ e, i.e = some e → i.n - 1 ≤ e → f i = f { i with e := none }\n\n/-! ## P4: output contract (with a survey of what callers rely on) -/\n\n/-- Candidate contract on an `ok` result; sums are evaluated in `Int`. -/\ndef Contract (i : Input) : ChkOut → Prop\n  | .ok beg len =>\n      0 ≤ beg ∧ 0 ≤ len ∧\n        (if i.err = 1 then beg + len ≤ MAX else beg ≤ i.n ∧ beg + len ≤ i.n)\n  | _ => True\n\n/-- The model `f` satisfies the contract on every valid input. -/\ndef P4 (f : Input → ChkOut) : Prop :=\n  ∀ i : Input, i.Valid → Contract i (f i)\n\nend CrubyRange\n","lean/CrubyRange/Basic.lean":"/-!\n# Common definitions\n\nTarget: `rb_range_component_beg_len` and `rb_range_beg_len` in `range.c`\nof ruby/ruby `1f2a4bd5750bb3b685c24aee1fbd7530e895cf3f`, on an LP64\nplatform where `rb_len_t` is `long` (64 bits).\n-/\n\nnamespace CrubyRange\n\n/-- `LONG_MIN` on LP64. -/\ndef MIN : Int := -(2 ^ 63)\n\n/-- `LONG_MAX` on LP64. -/\ndef MAX : Int := 2 ^ 63 - 1\n\n/-- One call of `rb_range_component_beg_len(b, e, excl, &beg, &len, n, err)`.\nEndpoints are Integers or `nil`; values that go through `#to_int` are out of scope. -/\nstructure Input where\n  b    : Option Int\n  e    : Option Int\n  excl : Bool\n  n    : Int\n  err  : Nat\n  deriving Repr, DecidableEq\n\n/-- Inputs in scope: endpoints representable as `long` (otherwise `NUM2LEN`\nraises before the function body runs), `0 ≤ n ≤ LONG_MAX`, `err ∈ {0,1,2}`. -/\ndef Input.Valid (i : Input) : Prop :=\n  (∀ x, i.b = some x → MIN ≤ x ∧ x ≤ MAX) ∧\n  (∀ x, i.e = some x → MIN ≤ x ∧ x ≤ MAX) ∧\n  0 ≤ i.n ∧ i.n ≤ MAX ∧ i.err ≤ 2\n\n/-- Result of `rb_range_component_beg_len`: `Qtrue` with `*begp`, `*lenp`\nfilled in, or `Qnil` (`goto out_of_range`). -/\ninductive Out where\n  | ok (beg len : Int)\n  | out\n  deriving Repr, DecidableEq\n\n/-- Result of an implementation model that may hit signed overflow. -/\ninductive ChkOut where\n  | ok (beg len : Int)\n  | out\n  | overflow\n  deriving Repr, DecidableEq\n\ndef Out.toChk : Out → ChkOut\n  | .ok b l => .ok b l\n  | .out    => .out\n\nend CrubyRange\n","lean/CrubyRange/Cases.lean":"import CrubyRange.Basic\n\n/-! # Concrete inputs used by the known answers, the proofs and the non-vacuity checks -/\n\nnamespace CrubyRange\n\n/-- `[1,2][0..LONG_MAX]` -/\ndef caseEndMax : Input := { b := some 0, e := some MAX, excl := false, n := 2, err := 0 }\n\n/-- `R = -1..LONG_MAX` with err = 1 (e.g. `values_at`): two wrap-arounds. -/\ndef caseDouble : Input := { b := some (-1), e := some MAX, excl := false, n := 2, err := 1 }\n\n/-- `[1,2][0..1]`: an ordinary read with no overflow. -/\ndef caseNormal : Input := { b := some 0, e := some 1, excl := false, n := 2, err := 0 }\n\n/-- O2: `LONG_MAX..LONG_MIN` with err = 1 and n = 2. -/\ndef caseO2 : Input := { b := some MAX, e := some MIN, excl := false, n := 2, err := 1 }\n\nend CrubyRange\n","lean/CrubyRange/Fixed.lean":"import CrubyRange.Spec\nimport CrubyRange.Impl\n\n/-!\n# The fix under test: ruby/ruby#19824\n\n`patches/range-beg-len-overflow.patch` (commit d4d80a35 of\ngotoken/ruby `fix-range-beg-len-overflow`, the head of ruby/ruby#19824)\nchanges two statements of `rb_range_component_beg_len`:\n\n```c\n    /* Include the end point.  RB_LEN_MAX + 1 is not representable, so\n     * saturate instead of overflowing. */\n    if (!excl && end < RB_LEN_MAX)\n        end++;\n    ...\n    /* beg is non-negative here, so end - beg cannot overflow. */\n    len = end > beg ? end - beg : 0;\n```\n\nand documents: \"On success, `*begp` and `*lenp` are non-negative and their\nsum does not exceed `RB_LEN_MAX`.\" (`fix_doc_contract` in `FixedProofs.lean`).\n\n`bodyFixed` is `body` with exactly these two changes.\n-/\n\nnamespace CrubyRange\n\n/-- The patched function body, parameterised like `body`. -/\ndef bodyFixed (arith : Int → Option Int) (i : Input) : ChkOut :=\n  let beg0 := i.b.getD 0\n  let end0 := i.e.getD (-1)\n  let excl := i.e.isSome && i.excl\n  match (if beg0 < 0 then arith (beg0 + i.n) else some beg0) with\n  | none => .overflow\n  | some beg =>\n    if beg < 0 then .out else\n    match (if end0 < 0 then arith (end0 + i.n) else some end0) with\n    | none => .overflow\n    | some end1 =>\n      -- if (!excl && end < RB_LEN_MAX) end++;\n      match (if excl || decide (MAX ≤ end1) then some end1 else arith (end1 + 1)) with\n      | none => .overflow\n      | some end2 =>\n        let clip := i.err == 0 || i.err == 2\n        if clip && i.n < beg then .out else\n        let end3 := if clip && i.n < end2 then i.n else end2\n        -- len = end > beg ? end - beg : 0;\n        if beg < end3 then\n          match arith (end3 - beg) with\n          | none => .overflow\n          | some l => .ok beg l\n        else .ok beg 0\n\n/-- The patched function with checked arithmetic. -/\ndef mChkFixed (i : Input) : ChkOut :=\n  bodyFixed checked i\n\n/-- The patched function with 64-bit wrap-around (what the GCC build runs). -/\ndef mWrapFixed (i : Input) : ChkOut :=\n  bodyFixed (fun x => some (wrap64 x)) i\n\n/-- S with the exclusive end capped at `LONG_MAX`. It differs from S only for\n`err = 1` on O1 inputs, where S's end `LONG_MAX + 1` is not representable. -/\ndef specSat (i : Input) : Out :=\n  let B := specBeg i\n  let E := min (specEnd i) MAX\n  if B < 0 then .out\n  else if i.err = 1 then .ok B (max (E - B) 0)\n  else if i.n < B then .out\n  else .ok B (max (min E i.n - B) 0)\n\nend CrubyRange\n","lean/CrubyRange/Proofs.lean":"import CrubyRange.Statements\nimport CrubyRange.Cases\n\n/-!\n# Proofs of P1, P1_repr, P2, P3, P3_safe and P4\n\nEach proof splits on the shape of the input (`nil` or Integer endpoints,\ninclusive or exclusive), unfolds the definitions and lets `grind` do the\ncase analysis on the `if`s and the linear integer arithmetic.\n-/\n\nnamespace CrubyRange\n\n/-- P1: wherever M_chk does not overflow, it agrees with S. -/\ntheorem p1 : P1 := by\n  rintro ⟨b, e, excl, n, err⟩ ⟨hb, he, hn0, hnM, herr⟩ hno\n  dsimp only at hb he hn0 hnM herr\n  rcases (by omega : err = 0 ∨ err = 1 ∨ err = 2) with rfl | rfl | rfl <;>\n    cases b <;> cases e <;> cases excl <;>\n      simp [mChk, body, checked, spec, specBeg, specEnd, Out.toChk, MIN, MAX] at * <;>\n      grind\n\n/-- P1_repr: for `err ∈ {0,2}`, S's result fits in `long`. -/\ntheorem p1_repr : P1_repr := by\n  rintro ⟨b, e, excl, n, err⟩ ⟨hb, he, hn0, hnM, herr⟩ herr1 beg len hs\n  cases b <;> cases e <;> cases excl <;>\n    simp only [spec, specBeg, specEnd, MIN, MAX] at * <;>\n    grind\n\n/-- P3: M_chk overflows exactly on O1 or O2. -/\ntheorem p3 : P3 := by\n  rintro ⟨b, e, excl, n, err⟩ ⟨hb, he, hn0, hnM, herr⟩\n  cases b <;> cases e <;> cases excl <;>\n    simp only [mChk, body, checked, O1, O2, specBeg, specEnd, MIN, MAX] at * <;>\n    grind\n\n/-- P3_safe: for `err ∈ {0,2}`, an exclusive range or an end other than\n`LONG_MAX` never overflows. -/\ntheorem p3_safe : P3_safe := by\n  intro i hv herr hcond hov\n  have := (p3 i hv).mp hov\n  rcases this with ⟨_, he, hx⟩ | ⟨h1, _⟩\n  · rcases hcond with h | h\n    · exact h he\n    · simp [h] at hx\n  · exact herr h1\n\n/-! ## P2: saturation at the upper end -/\n\n/-- P2 holds for S. -/\ntheorem p2_spec : P2 (fun i => (spec i).toChk) := by\n  rintro ⟨b, e', excl, n, err⟩ ⟨hb, he, hn0, hnM, herr⟩ herr0 hexcl e hee hge\n  dsimp only at hb he hn0 hnM herr herr0 hexcl hee hge\n  subst herr0 hexcl hee\n  cases b <;>\n    simp [spec, specBeg, specEnd, Out.toChk, MIN, MAX] at * <;>\n    grind\n\n/-- P2 fails for M_wrap: `[1,2][0..LONG_MAX]` differs from `[1,2][0..]`. -/\ntheorem not_p2_wrap : ¬ P2 mWrap := by\n  intro h\n  have hv : caseEndMax.Valid := by simp [Input.Valid, caseEndMax, MIN, MAX]\n  have := h caseEndMax hv rfl rfl MAX rfl (by decide)\n  revert this\n  decide\n\n/-! ## P4: output contract, in four parts -/\n\n/-- P4 for S with `err ∈ {0,2}`: the contract holds. -/\ntheorem p4_spec_clip : ∀ i : Input, i.Valid → i.err ≠ 1 → Contract i (spec i).toChk := by\n  rintro ⟨b, e, excl, n, err⟩ ⟨hb, he, hn0, hnM, herr⟩ herr1\n  dsimp only at hb he hn0 hnM herr herr1\n  cases b <;> cases e <;> cases excl <;>\n    simp [Contract, spec, specBeg, specEnd, Out.toChk, MIN, MAX] at * <;>\n    grind\n\n/-- P4 for S with `err = 1`: the contract fails exactly on O1, i.e. when the\ninclusive end is `LONG_MAX` and the start is in range (`B + len = MAX + 1`). -/\ntheorem p4_spec_err1 :\n    ∀ i : Input, i.Valid → i.err = 1 → (Contract i (spec i).toChk ↔ ¬ O1 i) := by\n  rintro ⟨b, e, excl, n, err⟩ ⟨hb, he, hn0, hnM, herr⟩ herr1\n  dsimp only at hb he hn0 hnM herr herr1\n  subst herr1\n  cases b <;> cases e <;> cases excl <;>\n    simp [Contract, spec, specBeg, specEnd, Out.toChk, O1, MIN, MAX] at * <;>\n    grind\n\n/-- P4 holds for M_chk: every `ok` result of M_chk satisfies the contract.\nDerived from P1 (M_chk agrees with S where it does not overflow), P3 (it\noverflows on O1) and the two results for S above. -/\ntheorem p4_chk : P4 mChk := by\n  intro i hv\n  by_cases hov : mChk i = .overflow\n  · rw [hov]; exact True.intro\n  · rw [p1 i hv hov]\n    by_cases h1 : i.err = 1\n    · exact (p4_spec_err1 i hv h1).mpr (fun ho => hov ((p3 i hv).mpr (Or.inl ho)))\n    · exact p4_spec_clip i hv h1\n\n/-- P4 fails for M_wrap, already for a read (`err = 0`): `[1,2][-1..LONG_MAX]`\ngives `beg = 1, len = LONG_MAX` although `n = 2`. -/\ntheorem not_p4_wrap : ¬ P4 mWrap := by\n  intro h\n  have hv : ({ caseDouble with err := 0 } : Input).Valid := by\n    simp [Input.Valid, caseDouble, MIN, MAX]\n  have hc := h _ hv\n  have hw : mWrap { caseDouble with err := 0 } = .ok 1 MAX := by decide\n  rw [hw] at hc\n  simp [Contract, caseDouble, MAX] at hc\n\n/-- The same range with `err = 1` (e.g. `values_at`) also breaks the contract:\n`beg + len = LONG_MAX + 1`. -/\ntheorem wrap_breaks_contract_err1 :\n    caseDouble.Valid ∧ ¬ Contract caseDouble (mWrap caseDouble) := by\n  refine ⟨by simp [Input.Valid, caseDouble, MIN, MAX], ?_⟩\n  have hw : mWrap caseDouble = .ok 1 MAX := by decide\n  rw [hw]\n  simp [Contract, caseDouble, MAX]\n\nend CrubyRange\n","lean/CrubyRange/FixedProofs.lean":"import CrubyRange.Statements\nimport CrubyRange.Fixed\nimport CrubyRange.Proofs\n\n/-!\n# Properties of the proposed fix\n\n* `fix_no_overflow`: in the model of the patched function (64-bit `long`,\n  inputs satisfying `Input.Valid`), no modelled `long` operation overflows.\n  For the modelled arithmetic this removes the dependence on how signed\n  overflow is treated.\n* `fix_preserves`: wherever the original did not overflow, the patched\n  function returns exactly what the original returned.\n* `fix_eq_specSat`, `specSat_eq_spec`, `fix_eq_spec_clip`: the patched\n  function agrees with S, except for `err = 1` on O1 inputs, where S's end\n  `LONG_MAX + 1` is not representable and the fix uses `LONG_MAX`.\n* `fix_p2`, `fix_p4`: P2 and P4, which fail for the original (M_wrap),\n  hold for the patched function.\n* `fix_doc_contract`: the contract stated in the patched doc comment.\n\nAll of this is about the Lean model. That the model follows the C code is\nestablished by review and by the differential test against the patched\nCRuby (gcc 13), not by proof; so is the conclusion that the C function has\nno signed overflow on these inputs.\n-/\n\nnamespace CrubyRange\n\ntheorem fix_no_overflow : ∀ i : Input, i.Valid → mChkFixed i ≠ .overflow := by\n  rintro ⟨b, e, excl, n, err⟩ ⟨hb, he, hn0, hnM, herr⟩\n  dsimp only at hb he hn0 hnM herr\n  rcases (by omega : err = 0 ∨ err = 1 ∨ err = 2) with rfl | rfl | rfl <;>\n    cases b <;> cases e <;> cases excl <;>\n      simp [mChkFixed, bodyFixed, checked, MIN, MAX] at * <;>\n      grind (splits := 30)\n\ntheorem fix_eq_specSat : ∀ i : Input, i.Valid → mChkFixed i = (specSat i).toChk := by\n  rintro ⟨b, e, excl, n, err⟩ ⟨hb, he, hn0, hnM, herr⟩\n  dsimp only at hb he hn0 hnM herr\n  rcases (by omega : err = 0 ∨ err = 1 ∨ err = 2) with rfl | rfl | rfl <;>\n    cases b <;> cases e <;> cases excl <;>\n      simp [mChkFixed, bodyFixed, checked, specSat, specBeg, specEnd, Out.toChk, MIN, MAX] at * <;>\n      grind (splits := 30)\n\ntheorem specSat_eq_spec :\n    ∀ i : Input, i.Valid → ¬ (i.err = 1 ∧ O1 i) → specSat i = spec i := by\n  rintro ⟨b, e, excl, n, err⟩ ⟨hb, he, hn0, hnM, herr⟩ hno\n  dsimp only at hb he hn0 hnM herr\n  rcases (by omega : err = 0 ∨ err = 1 ∨ err = 2) with rfl | rfl | rfl <;>\n    cases b <;> cases e <;> cases excl <;>\n      simp [specSat, spec, specBeg, specEnd, O1, MIN, MAX] at * <;>\n      grind\n\n/-- For reads and string writes the patched function agrees with S exactly. -/\ntheorem fix_eq_spec_clip :\n    ∀ i : Input, i.Valid → i.err ≠ 1 → mChkFixed i = (spec i).toChk := by\n  intro i hv herr\n  rw [fix_eq_specSat i hv, specSat_eq_spec i hv (fun h => herr h.1)]\n\n/-- Wherever the original did not overflow, the fix changes nothing. -/\ntheorem fix_preserves : ∀ i : Input, i.Valid → mChk i ≠ .overflow → mChkFixed i = mChk i := by\n  intro i hv hno\n  rw [fix_eq_specSat i hv, p1 i hv hno]\n  have : ¬ O1 i := fun ho => hno ((p3 i hv).mpr (Or.inl ho))\n  rw [specSat_eq_spec i hv (fun h => this h.2)]\n\ntheorem fix_p2 : P2 mChkFixed := by\n  intro i hv herr hexcl e he hge\n  have hv' : ({ i with e := none } : Input).Valid := by\n    obtain ⟨hb, _, hn0, hnM, herr2⟩ := hv\n    exact ⟨hb, by simp, hn0, hnM, herr2⟩\n  have h1 := fix_eq_spec_clip i hv (by omega)\n  have h2 := fix_eq_spec_clip { i with e := none } hv' (by simp; omega)\n  rw [h1, h2]\n  exact p2_spec i hv herr hexcl e he hge\n\ntheorem fix_p4 : P4 mChkFixed := by\n  intro i hv\n  rw [fix_eq_specSat i hv]\n  by_cases h1 : i.err = 1\n  · by_cases ho : O1 i\n    · -- the saturated interval: B + len = LONG_MAX\n      obtain ⟨b, e, excl, n, err⟩ := i\n      obtain ⟨hb, he, hn0, hnM, herr⟩ := hv\n      dsimp only at hb he hn0 hnM herr h1 ho ⊢\n      subst h1\n      cases b <;> cases e <;> cases excl <;>\n        simp [Contract, specSat, specBeg, specEnd, Out.toChk, O1, MIN, MAX] at * <;>\n        grind\n    · rw [specSat_eq_spec i hv (fun h => ho h.2)]\n      exact (p4_spec_err1 i hv h1).mpr ho\n  · rw [specSat_eq_spec i hv (fun h => h1 h.1)]\n    exact p4_spec_clip i hv h1\n\n/-- The contract in the doc comment added by ruby/ruby#19824: \"On success,\n`*begp` and `*lenp` are non-negative and their sum does not exceed\n`RB_LEN_MAX`.\" -/\ntheorem fix_doc_contract :\n    ∀ i : Input, i.Valid → ∀ b l, mChkFixed i = .ok b l → 0 ≤ b ∧ 0 ≤ l ∧ b + l ≤ MAX := by\n  intro i hv b l h\n  have hc := fix_p4 i hv\n  rw [h] at hc\n  have hnM : i.n ≤ MAX := hv.2.2.2.1\n  by_cases h1 : i.err = 1 <;> simp [Contract, h1] at hc <;> omega\n\nend CrubyRange\n","lean/CrubyRange/NonVacuity.lean":"import CrubyRange.Statements\nimport CrubyRange.Cases\nimport CrubyRange.Fixed\n\n/-!\n# Non-vacuity\n\nFor every theorem in `Proofs.lean`, a concrete input that meets all of its\npremises, so that none of them holds only because its premises are\nunsatisfiable. For P3 both sides of the equivalence are realised.\n-/\n\nnamespace CrubyRange\n\ntheorem caseNormal_valid : caseNormal.Valid := by simp [Input.Valid, caseNormal, MIN, MAX]\ntheorem caseEndMax_valid : caseEndMax.Valid := by simp [Input.Valid, caseEndMax, MIN, MAX]\ntheorem caseDouble_valid : caseDouble.Valid := by simp [Input.Valid, caseDouble, MIN, MAX]\ntheorem caseO2_valid : caseO2.Valid := by simp [Input.Valid, caseO2, MIN, MAX]\n\n/-- P1: valid, M_chk does not overflow, and the result is an ordinary `ok`. -/\nexample : caseNormal.Valid ∧ mChk caseNormal ≠ .overflow ∧ mChk caseNormal = .ok 0 2 :=\n  ⟨caseNormal_valid, by decide, by decide⟩\n\n/-- P1_repr: valid, `err ≠ 1`, and S returns `ok`. -/\nexample : caseNormal.Valid ∧ caseNormal.err ≠ 1 ∧ spec caseNormal = .ok 0 2 :=\n  ⟨caseNormal_valid, by decide, by decide⟩\n\n/-- P3, no overflow and neither O1 nor O2. -/\nexample : caseNormal.Valid ∧ mChk caseNormal ≠ .overflow ∧ ¬ (O1 caseNormal ∨ O2 caseNormal) := by\n  refine ⟨caseNormal_valid, by decide, ?_⟩\n  simp [O1, O2, caseNormal, specBeg, specEnd, MIN, MAX]\n\n/-- P3, overflow through O1. -/\nexample : caseEndMax.Valid ∧ mChk caseEndMax = .overflow ∧ O1 caseEndMax := by\n  refine ⟨caseEndMax_valid, by decide, ?_⟩\n  simp [O1, caseEndMax, specBeg]\n\n/-- P3, overflow through O2 (and not O1). -/\nexample : caseO2.Valid ∧ mChk caseO2 = .overflow ∧ O2 caseO2 ∧ ¬ O1 caseO2 := by\n  refine ⟨caseO2_valid, by decide, ?_, ?_⟩\n  · simp [O2, caseO2, specBeg, specEnd, MIN, MAX]\n  · simp [O1, caseO2, specBeg, MIN, MAX]\n\n/-- P3_safe: valid, `err ≠ 1`, and an end other than `LONG_MAX`. -/\nexample : caseNormal.Valid ∧ caseNormal.err ≠ 1 ∧ caseNormal.e ≠ some MAX :=\n  ⟨caseNormal_valid, by decide, by decide⟩\n\n/-- P2: valid, `err = 0`, inclusive, and the end is at the last index. -/\nexample : caseNormal.Valid ∧ caseNormal.err = 0 ∧ caseNormal.excl = false ∧\n    caseNormal.e = some 1 ∧ caseNormal.n - 1 ≤ 1 :=\n  ⟨caseNormal_valid, rfl, rfl, rfl, by decide⟩\n\n/-- P4 for S and M_chk with `err ∈ {0,2}`: an `ok` result to check. -/\nexample : caseNormal.Valid ∧ caseNormal.err ≠ 1 ∧ (spec caseNormal).toChk = .ok 0 2 ∧\n    mChk caseNormal = .ok 0 2 :=\n  ⟨caseNormal_valid, by decide, by decide, by decide⟩\n\n/-- P4 for S with `err = 1`: both sides of the equivalence occur. -/\nexample : caseO2.Valid ∧ caseO2.err = 1 ∧ ¬ O1 caseO2 ∧\n    caseDouble.Valid ∧ caseDouble.err = 1 ∧ O1 caseDouble := by\n  refine ⟨caseO2_valid, rfl, ?_, caseDouble_valid, rfl, ?_⟩\n  · simp [O1, caseO2, specBeg, MIN, MAX]\n  · simp [O1, caseDouble, specBeg]\n\n/-! ## The fix (`FixedProofs.lean`)\n\n`fix_no_overflow`, `fix_eq_specSat`, `fix_p2` and `fix_p4` have the same\npremises as the theorems above (`caseNormal` meets them). The remaining ones: -/\n\n/-- `specSat_eq_spec` and `fix_eq_spec_clip`: valid and `err ≠ 1`. -/\nexample : caseNormal.Valid ∧ caseNormal.err ≠ 1 ∧ ¬ (caseNormal.err = 1 ∧ O1 caseNormal) :=\n  ⟨caseNormal_valid, by decide, fun h => absurd h.1 (by decide)⟩\n\n/-- The exception in `specSat_eq_spec` is real: on `caseDouble` (err = 1, O1)\nspecSat and S differ. -/\nexample : caseDouble.err = 1 ∧ O1 caseDouble ∧ specSat caseDouble ≠ spec caseDouble := by\n  refine ⟨rfl, ?_, by decide⟩\n  simp [O1, caseDouble, specBeg]\n\n/-- `fix_preserves`: valid and the original does not overflow. -/\nexample : caseNormal.Valid ∧ mChk caseNormal ≠ .overflow :=\n  ⟨caseNormal_valid, by decide⟩\n\nend CrubyRange\n","lean/CrubyRange/Examples.lean":"import CrubyRange.Spec\nimport CrubyRange.Impl\nimport CrubyRange.Cases\nimport CrubyRange.Fixed\n\n/-!\n# Known answers\n\nConcrete evaluations checked by the kernel. The right-hand sides are the\noutputs of the pinned CRuby (`harness/beg_len.c`, normal build) recorded in\n`docs/findings-2026-11-10.md`; S gives the intended result.\n-/\n\nnamespace CrubyRange\n\n-- `[1,2][0..LONG_MAX]`\nexample : mWrap caseEndMax = .ok 0 0 := by decide\nexample : mChk caseEndMax = .overflow := by decide\nexample : spec caseEndMax = .ok 0 2 := by decide\n\n-- `[1,2][0..100]`\nexample : mWrap { caseEndMax with e := some 100 } = .ok 0 2 := by decide\n\n-- `R = -1..LONG_MAX` with err = 1: two wrap-arounds\nexample : mWrap caseDouble = .ok 1 MAX := by decide\nexample : spec caseDouble = .ok 1 MAX := by decide  -- B + len = MAX + 1: not representable\n\n-- The same range with err = 0: S clips, M_wrap does not.\nexample : mWrap { caseDouble with err := 0 } = .ok 1 MAX := by decide\nexample : spec { caseDouble with err := 0 } = .ok 1 1 := by decide\n\n-- `[1,2][0..1]`\nexample : mWrap caseNormal = .ok 0 2 := by decide\nexample : mChk caseNormal = .ok 0 2 := by decide\nexample : spec caseNormal = .ok 0 2 := by decide\n\n-- O2: `LONG_MAX..LONG_MIN` with err = 1\nexample : mWrap caseO2 = .ok MAX 4 := by decide\nexample : mChk caseO2 = .overflow := by decide\nexample : spec caseO2 = .ok MAX 0 := by decide\n\n/-! ## The proposed fix on the same inputs -/\n\nexample : mChkFixed caseNormal = .ok 0 2 := by decide\nexample : mChkFixed caseEndMax = .ok 0 2 := by decide          -- was ok 0 0\nexample : mChkFixed { caseDouble with err := 0 } = .ok 1 1 := by decide  -- was ok 1 MAX\nexample : mChkFixed caseDouble = .ok 1 (MAX - 1) := by decide  -- saturated; S has MAX\nexample : mChkFixed caseO2 = .ok MAX 0 := by decide            -- was ok MAX 4\n\nend CrubyRange\n\n","lean/CrubyRange.lean":"import CrubyRange.Basic\nimport CrubyRange.Spec\nimport CrubyRange.Impl\nimport CrubyRange.Cases\nimport CrubyRange.Statements\nimport CrubyRange.Examples\nimport CrubyRange.Proofs\nimport CrubyRange.NonVacuity\nimport CrubyRange.Fixed\nimport CrubyRange.FixedProofs\n"}}</script>
<script type="application/json" id="demo-tr">{"日本語":{"lean/CrubyRange/Basic.lean":{"b0":{"id":"b0","title":"モジュール説明: 共通の定義","math":"対象は ruby/ruby `1f2a4bd5750b…` の `range.c` にある `rb_range_component_beg_len` と `rb_range_beg_len`。LP64 環境（`rb_len_t` が 64 ビットの `long`）を前提とする。","proof":"","lean":"","src":""},"b2":{"id":"b2","title":"定義: MIN（LONG_MIN）","math":"$\\mathrm{MIN} = -2^{63}$。LP64 での `LONG_MIN`。","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"定義: MAX（LONG_MAX）","math":"$\\mathrm{MAX} = 2^{63} - 1$。LP64 での `LONG_MAX`。","proof":"","lean":"","src":""},"b4":{"id":"b4","title":"構造体: 1 回の呼び出しの入力","math":"`rb_range_component_beg_len(b, e, excl, &beg, &len, n, err)` の 1 回の呼び出しに渡すものを並べた組。\n\n- `b`: 範囲の始点（整数、または `nil`）\n- `e`: 範囲の終点（整数、または `nil`）\n- `excl`: 終点を含まないか（`a...b` なら真、`a..b` なら偽）\n- `n`: 対象の長さ（C の `len`）\n- `err`: 呼び出し側の用途を表すフラグ（0・1・2）\n\n`#to_int` を経由して整数になる値は対象外。","proof":"","lean":"`Option Int` の `none` が Ruby の `nil` にあたる。`deriving Repr, DecidableEq` は表示と等号判定を自動で用意する指定。","src":""},"b5":{"id":"b5","title":"定義: 対象とする入力（Valid）","math":"$$\\mathrm{Valid}(i) :\\iff (b = x \\Rightarrow \\mathrm{MIN} \\le x \\le \\mathrm{MAX}) \\wedge (e = x \\Rightarrow \\mathrm{MIN} \\le x \\le \\mathrm{MAX}) \\wedge 0 \\le n \\le \\mathrm{MAX} \\wedge err \\le 2$$\n端点が `long` に収まらない場合は、関数本体に入る前に `NUM2LEN` が例外を出すので、対象から外している。","proof":"","lean":"`∀ x, i.b = some x → …` は「b が整数 x なら …」。b が `nil` のときは条件なしに成り立つ。`Prop` を返す定義なので、真偽を計算する関数ではなく命題に名前を付けている。","src":""},"b6":{"id":"b6","title":"帰納型: 関数の結果（Out）","math":"次のどちらか。\n\n- `ok beg len`: `Qtrue` を返し、`*begp` と `*lenp` に beg と len が入る\n- `out`: `Qnil` を返す（C の `goto out_of_range`）","proof":"","lean":"","src":""},"b7":{"id":"b7","title":"帰納型: 実装モデルの結果（ChkOut）","math":"`Out` の 2 つに、`overflow`（符号付きオーバーフローに当たった）を加えたもの。オーバーフローを検出するモデルの結果に使う。","proof":"","lean":"","src":""},"b8":{"id":"b8","title":"定義: Out を ChkOut に埋め込む","math":"`ok b l` は `ok b l` に、`out` は `out` に対応させる。仕様 S（`Out` を返す）と実装モデル（`ChkOut` を返す）を比べるために使う。","proof":"","lean":"","src":""}},"lean/CrubyRange/Cases.lean":{"b1":{"id":"b1","title":"モジュール説明: 具体的な入力","math":"既知の正解、証明、非空性の確認（命題の前提が満たされる入力が実際にあること）で使う具体的な入力。","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"定義: caseEndMax（`[1,2][0..LONG_MAX]`）","math":"$b = 0,\\ e = \\mathrm{MAX}$、終点を含む、$n = 2,\\ err = 0$。Ruby の `[1,2][0..LONG_MAX]` にあたる。","proof":"","lean":"","src":""},"b4":{"id":"b4","title":"定義: caseDouble（2 回折り返す例）","math":"$b = -1,\\ e = \\mathrm{MAX}$、終点を含む、$n = 2,\\ err = 1$。範囲 `-1..LONG_MAX` を err = 1（`values_at` など）で使う場合で、64 ビットの折り返しが 2 回起きる。","proof":"","lean":"","src":""},"b5":{"id":"b5","title":"定義: caseNormal（普通の読み出し）","math":"$b = 0,\\ e = 1$、終点を含む、$n = 2,\\ err = 0$。`[1,2][0..1]` にあたる、オーバーフローのない普通の読み出し。","proof":"","lean":"","src":""},"b6":{"id":"b6","title":"定義: caseO2（O2 の例）","math":"$b = \\mathrm{MAX},\\ e = \\mathrm{MIN}$、終点を含む、$n = 2,\\ err = 1$。範囲 `LONG_MAX..LONG_MIN` で、オーバーフロー条件 O2 に当たる。","proof":"","lean":"","src":""}},"lean/CrubyRange/Spec.lean":{"b1":{"id":"b1","title":"モジュール説明: 仕様 S","math":"数学的な整数の上で定義した仕様で、C コードの文の順序には依らない。文章による説明は `PROPERTIES.md` にある。","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"定義: 正規化した始点 B","math":"$b_0$ を始点（`nil` なら 0）として\n$$B = \\begin{cases} b_0 + n & (b_0 < 0) \\\\ b_0 & (b_0 \\ge 0) \\end{cases}$$\n負の値は末尾から数える。","proof":"","lean":"","src":""},"b4":{"id":"b4","title":"定義: 正規化した終点 E（含まない側）","math":"終点が `nil`（終わりのない範囲）なら $E = n$。そうでなければ、終点 e を $e' = e + n$（$e < 0$ のとき）または $e' = e$ と正規化し、\n$$E = e' + \\begin{cases} 0 & (\\text{終点を含まない}) \\\\ 1 & (\\text{終点を含む}) \\end{cases}$$\nつまり E は「最後の添字の 1 つ先」。","proof":"","lean":"","src":""},"b5":{"id":"b5","title":"定義: 仕様 S（意図される区間）","math":"$$S(i) = \\begin{cases} \\mathrm{out} & (B < 0) \\\\ \\mathrm{ok}\\bigl(B,\\ \\max(E - B,\\ 0)\\bigr) & (err = 1) \\\\ \\mathrm{out} & (n < B) \\\\ \\mathrm{ok}\\bigl(B,\\ \\max(\\min(E, n) - B,\\ 0)\\bigr) & (\\text{それ以外}) \\end{cases}$$\n\n- err ∈ {0, 2}: 選ばれる添字は $[B, E) \\cap [0, n)$。始点が末尾より後なら範囲外。\n- err = 1: 区間 $[B, E)$ を n で切り詰めない（受け手を伸ばすことがある）。\n\nS は常にこの数学的な区間を返す。区間が `long` に収まらない場合（err = 1 で len や B + len が `LONG_MAX` を超える）にどうすべきかはモデル化しておらず、例外も出さない。表現できるかどうかは `P1_repr` と `P4` で別に調べる。","proof":"","lean":"`max (E - B) 0` は長さが負にならないようにするため。比較と演算はすべて `Int`（上限のない整数）なので、ここではあふれは起きない。","src":""}},"lean/CrubyRange/Impl.lean":{"b1":{"id":"b1","title":"モジュール説明: 実装モデル M_chk と M_wrap","math":"どちらも `rb_range_component_beg_len`（range.c、ruby/ruby 1f2a4bd）を文ごとに写したモデルで、違いは `long` の加算・減算の扱いだけ。\n\n引用している C の処理は次のとおり。\n\n1. 始点 beg（nil なら 0）と終点 end（nil なら −1）を取り出す。終点が nil なら「終点を含まない」を偽にする\n2. beg < 0 なら len を足し、それでも負なら範囲外\n3. end < 0 なら len を足す\n4. 終点を含むなら end を 1 増やす\n5. err が 0 か 2 なら、beg > len で範囲外、end > len なら end = len に切り詰める\n6. len = end − beg とし、負なら 0","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"定義: 検査つきの long 演算","math":"$$\\mathrm{checked}(x) = \\begin{cases} \\mathrm{some}\\ x & (\\mathrm{MIN} \\le x \\le \\mathrm{MAX}) \\\\ \\mathrm{none} & (\\text{それ以外 = 符号付きオーバーフロー}) \\end{cases}$$","proof":"","lean":"","src":""},"b4":{"id":"b4","title":"定義: 64 ビットへの折り返し","math":"$$\\mathrm{wrap64}(x) = \\bigl((x - \\mathrm{MIN}) \\bmod 2^{64}\\bigr) + \\mathrm{MIN}$$\n2 の補数で 64 ビットに折り返した値。結果は常に $[\\mathrm{MIN}, \\mathrm{MAX}]$ に入る。","proof":"","lean":"`%` は `Int.emod` で、除数が正なら結果は 0 以上。そのため和は $\\mathrm{MIN}$ 以上 $\\mathrm{MAX}$ 以下になる。","src":""},"b5":{"id":"b5","title":"定義: 関数本体（演算の扱いを引数にしたもの）","math":"arith は `long` の加算・減算の結果を与える関数（`none` はオーバーフロー）。入力 i に対して次の順に計算する。\n\n1. $b_0$ = 始点（nil なら 0）、$e_0$ = 終点（nil なら −1）。終点が nil なら「終点を含まない」を偽にする。\n2. $b_0 < 0$ なら $\\mathit{beg} = \\mathrm{arith}(b_0 + n)$、そうでなければ $\\mathit{beg} = b_0$。$\\mathit{beg} < 0$ なら `out`。\n3. $e_0 < 0$ なら $e_1 = \\mathrm{arith}(e_0 + n)$、そうでなければ $e_1 = e_0$。\n4. 終点を含むなら $e_2 = \\mathrm{arith}(e_1 + 1)$、そうでなければ $e_2 = e_1$。\n5. err ∈ {0, 2} なら、$n < \\mathit{beg}$ で `out`、$e_2 > n$ なら $e_3 = n$（それ以外は $e_3 = e_2$）。\n6. $l = \\mathrm{arith}(e_3 - \\mathit{beg})$ とし、結果は $\\mathrm{ok}(\\mathit{beg},\\ \\max(l, 0))$。\n\n途中のどこかで arith が `none` を返したら、結果は `overflow`。","proof":"","lean":"`match … with | none => … | some x => …` で各演算の結果を場合分けしている。`i.b.getD 0` は Option から値を取り出し、`none` なら 0 を使う。`clip && i.n < beg` の `&&` は Bool の「かつ」。","src":"`--` のコメントは、そこで写している range.c の文。モジュール説明に引用した `rb_range_component_beg_len` の本体と 1 文ずつ対応する。"},"b6":{"id":"b6","title":"定義: M_chk（検査つき）","math":"$M_{chk}(i) = \\mathrm{body}(\\mathrm{checked}, i)$。すべての `long` 演算を検査し、$[\\mathrm{MIN}, \\mathrm{MAX}]$ を外れたら `overflow` を返す。C の意味に対して安全側（保守的）なモデル。","proof":"","lean":"","src":""},"b7":{"id":"b7","title":"定義: M_wrap（64 ビット折り返し）","math":"$M_{wrap}(i) = \\mathrm{body}(x \\mapsto \\mathrm{some}(\\mathrm{wrap64}(x)), i)$。すべての `long` 演算を $2^{64}$ を法として折り返す。`overflow` を返すことはない。","proof":"","lean":"生成されたコードと一致するのは `-fno-strict-overflow` が有効なときだけ（CRuby の configure が付ける。gcc 13 と clang 18 で確認）。付いていなければ符号付きオーバーフローは未定義動作で、このモデルは当てはまらない。","src":""}},"lean/CrubyRange/Statements.lean":{"b1":{"id":"b1","title":"モジュール説明: 命題 P1〜P4（主張だけ）","math":"ここにあるのは定理ではなく `Prop` の定義で、何を証明・反証するのかを正確に述べたもの。証明は `CrubyRange/Proofs.lean` にある。算術と比較はすべて `Int` の上で行う（折り返しなし）。","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"見出し: P1 仕様との一致（主目標）","math":"","proof":"","lean":"","src":""},"b4":{"id":"b4","title":"命題 P1: M_chk はオーバーフローしない限り S と一致する","math":"$$\\forall i,\\quad \\mathrm{Valid}(i) \\;\\wedge\\; M_{chk}(i) \\ne \\mathrm{overflow} \\;\\Longrightarrow\\; M_{chk}(i) = S(i)$$","proof":"","lean":"右辺の `(spec i).toChk` は、S の結果（`Out`）を `ChkOut` に埋め込んだもの。","src":""},"b5":{"id":"b5","title":"命題 P1_repr: err ∈ {0, 2} なら S の結果は long に収まる","math":"$$\\forall i,\\quad \\mathrm{Valid}(i) \\wedge err \\ne 1 \\wedge S(i) = \\mathrm{ok}(b, l) \\;\\Longrightarrow\\; \\mathrm{MIN} \\le b \\le \\mathrm{MAX} \\;\\wedge\\; \\mathrm{MIN} \\le l \\le \\mathrm{MAX}$$","proof":"","lean":"","src":""},"b6":{"id":"b6","title":"見出し: P3 演算の安全性（主目標）","math":"","proof":"","lean":"","src":""},"b7":{"id":"b7","title":"定義: オーバーフロー条件 O1","math":"$$O_1(i) :\\iff 0 \\le B \\;\\wedge\\; e = \\mathrm{MAX} \\;\\wedge\\; \\text{終点を含む}$$\n終点が `LONG_MAX` の範囲で `end++` があふれる場合。","proof":"","lean":"","src":"range.c:1925 の `end++`。"},"b8":{"id":"b8","title":"定義: オーバーフロー条件 O2（err = 1 のときだけ）","math":"$$O_2(i) :\\iff err = 1 \\;\\wedge\\; 0 \\le B \\;\\wedge\\; E - B < \\mathrm{MIN}$$\n`end - beg` が `LONG_MIN` を下回る場合。","proof":"","lean":"","src":"range.c:1932 の `end - beg`。"},"b9":{"id":"b9","title":"命題 P3: M_chk がオーバーフローするのは、ちょうど O1 か O2 のとき","math":"$$\\forall i,\\quad \\mathrm{Valid}(i) \\;\\Longrightarrow\\; \\bigl(M_{chk}(i) = \\mathrm{overflow} \\iff O_1(i) \\vee O_2(i)\\bigr)$$\n同値なので、O1・O2 以外ではあふれないことと、O1・O2 では必ずあふれることの両方を述べている。","proof":"","lean":"","src":""},"b10":{"id":"b10","title":"系 P3_safe: よくある使い方ではオーバーフローしない","math":"$$\\forall i,\\quad \\mathrm{Valid}(i) \\wedge err \\ne 1 \\wedge (e \\ne \\mathrm{MAX} \\vee \\text{終点を含まない}) \\;\\Longrightarrow\\; M_{chk}(i) \\ne \\mathrm{overflow}$$\nerr ∈ {0, 2} では、終点を含まない範囲か、終点が `LONG_MAX` 以外の範囲なら、あふれない。","proof":"","lean":"","src":""},"b11":{"id":"b11","title":"見出し: P2 上限での飽和性（要素の読み出しのみ）","math":"","proof":"","lean":"","src":""},"b12":{"id":"b12","title":"命題 P2(f): モデル f は上限で飽和する","math":"$$\\forall i,\\quad \\mathrm{Valid}(i) \\wedge err = 0 \\wedge \\text{終点を含む} \\wedge e = e_0 \\wedge n - 1 \\le e_0 \\;\\Longrightarrow\\; f(i) = f(i[e := \\mathrm{nil}])$$\n終点が最後の添字以降にある「終点を含む範囲」の結果は、終わりのない範囲（`b..`）の結果と同じになる、という性質。","proof":"","lean":"`{ i with e := none }` は、i の終点だけを `nil` に替えた入力。任意のモデル f について述べた命題で、S では成り立ち、M_wrap では `e = LONG_MAX` のとき破れる見込み、とコメントにある。","src":""},"b13":{"id":"b13","title":"見出し: P4 出力の契約（呼び出し側が頼っていることの調査つき）","math":"","proof":"","lean":"","src":""},"b14":{"id":"b14","title":"定義: ok の結果に課す契約の候補","math":"結果が $\\mathrm{ok}(\\mathit{beg}, \\mathit{len})$ のとき\n$$0 \\le \\mathit{beg} \\;\\wedge\\; 0 \\le \\mathit{len} \\;\\wedge\\; \\begin{cases} \\mathit{beg} + \\mathit{len} \\le \\mathrm{MAX} & (err = 1) \\\\ \\mathit{beg} \\le n \\;\\wedge\\; \\mathit{beg} + \\mathit{len} \\le n & (\\text{それ以外}) \\end{cases}$$\n`out` と `overflow` には何も課さない。","proof":"","lean":"和は `Int` で計算するので、契約の式そのものはあふれない。`| _ => True` は「それ以外の場合は無条件に成り立つ」。","src":""},"b15":{"id":"b15","title":"命題 P4(f): モデル f は契約を満たす","math":"$$\\forall i,\\quad \\mathrm{Valid}(i) \\;\\Longrightarrow\\; \\mathrm{Contract}\\bigl(i, f(i)\\bigr)$$","proof":"","lean":"","src":""}},"lean/CrubyRange/Fixed.lean":{"b1":{"id":"b1","title":"モジュール説明: 検証する修正（ruby/ruby#19824）","math":"`patches/range-beg-len-overflow.patch`（gotoken/ruby の `fix-range-beg-len-overflow` の commit d4d80a35。#19824 の先頭）は、`rb_range_component_beg_len` の 2 つの文を変える。\n\n- 終点を含むとき、`end < RB_LEN_MAX` の場合だけ `end++` する。`RB_LEN_MAX + 1` は表せないので、あふれさせずに飽和させる\n- `len = end > beg ? end - beg : 0;` にする。ここでは beg が非負なので、`end - beg` はあふれない\n\nさらに「成功したとき `*begp` と `*lenp` は非負で、その和は `RB_LEN_MAX` を超えない」と文書化する（`FixedProofs.lean` の `fix_doc_contract`）。`bodyFixed` は `body` にちょうどこの 2 点の変更を加えたもの。","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"定義: 修正後の関数本体","math":"`body` との違いは次の 2 点だけ。\n\n1. 終点を含むとき、$e_1 \\ge \\mathrm{MAX}$ なら $e_2 = e_1$（飽和）、そうでなければ $e_2 = \\mathrm{arith}(e_1 + 1)$。\n2. $\\mathit{beg} < e_3$ のときだけ $\\mathit{len} = \\mathrm{arith}(e_3 - \\mathit{beg})$、そうでなければ $\\mathit{len} = 0$。\n\nほかの手順（始点・終点の正規化、err ∈ {0, 2} での切り詰め）は `body` と同じ。","proof":"","lean":"`decide (MAX ≤ end1)` は命題を Bool に変えて if の条件に使っている。`excl || …` の `||` は Bool の「または」。","src":""},"b4":{"id":"b4","title":"定義: 修正後の M_chk","math":"$M_{chk}^{fixed}(i) = \\mathrm{bodyFixed}(\\mathrm{checked}, i)$。修正後の本体を検査つきの演算で動かすモデル。","proof":"","lean":"","src":""},"b5":{"id":"b5","title":"定義: 修正後の M_wrap","math":"$M_{wrap}^{fixed}(i) = \\mathrm{bodyFixed}(x \\mapsto \\mathrm{some}(\\mathrm{wrap64}(x)), i)$。修正後の本体を 64 ビットの折り返しで動かすモデル。GCC でビルドしたものが実際に実行する動作にあたる。","proof":"","lean":"","src":""},"b6":{"id":"b6","title":"定義: specSat（終点を LONG_MAX で打ち切った S）","math":"$E' = \\min(E, \\mathrm{MAX})$ として、S と同じ式で\n$$\\mathrm{specSat}(i) = \\begin{cases} \\mathrm{out} & (B < 0) \\\\ \\mathrm{ok}\\bigl(B,\\ \\max(E' - B,\\ 0)\\bigr) & (err = 1) \\\\ \\mathrm{out} & (n < B) \\\\ \\mathrm{ok}\\bigl(B,\\ \\max(\\min(E', n) - B,\\ 0)\\bigr) & (\\text{それ以外}) \\end{cases}$$\nS と違うのは err = 1 で O1 に当たる入力だけ。そこでは S の終点 `LONG_MAX + 1` が `long` で表せない。","proof":"","lean":"","src":""}}},"English":{"lean/CrubyRange/Basic.lean":{"b0":{"id":"b0","title":"Module doc: common definitions","math":"The target is `rb_range_component_beg_len` and `rb_range_beg_len` in `range.c` of ruby/ruby `1f2a4bd5750b…`, on an LP64 platform where `rb_len_t` is a 64-bit `long`.","proof":"","lean":"","src":""},"b2":{"id":"b2","title":"Definition: MIN (LONG_MIN)","math":"$\\mathrm{MIN} = -2^{63}$, the value of `LONG_MIN` on LP64.","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"Definition: MAX (LONG_MAX)","math":"$\\mathrm{MAX} = 2^{63} - 1$, the value of `LONG_MAX` on LP64.","proof":"","lean":"","src":""},"b4":{"id":"b4","title":"Structure: the input of one call","math":"The arguments of one call `rb_range_component_beg_len(b, e, excl, &beg, &len, n, err)`:\n\n- `b`: the start of the range (an integer or `nil`)\n- `e`: the end of the range (an integer or `nil`)\n- `excl`: whether the end is excluded (true for `a...b`, false for `a..b`)\n- `n`: the length of the receiver (the C variable `len`)\n- `err`: a flag for what the caller does with the result (0, 1 or 2)\n\nValues that become integers through `#to_int` are out of scope.","proof":"","lean":"`none` in `Option Int` stands for Ruby's `nil`. `deriving Repr, DecidableEq` asks Lean to generate printing and a decidable equality test.","src":""},"b5":{"id":"b5","title":"Definition: inputs in scope (Valid)","math":"$$\\mathrm{Valid}(i) :\\iff (b = x \\Rightarrow \\mathrm{MIN} \\le x \\le \\mathrm{MAX}) \\wedge (e = x \\Rightarrow \\mathrm{MIN} \\le x \\le \\mathrm{MAX}) \\wedge 0 \\le n \\le \\mathrm{MAX} \\wedge err \\le 2$$\nAn endpoint that does not fit in `long` makes `NUM2LEN` raise before the function body runs, so such inputs are excluded.","proof":"","lean":"`∀ x, i.b = some x → …` reads \"if b is an integer x, then …\"; when b is `nil` the condition holds trivially. The definition returns a `Prop`: it names a statement, it does not compute a truth value.","src":""},"b6":{"id":"b6","title":"Inductive type: the result of the function (Out)","math":"One of:\n\n- `ok beg len`: the function returns `Qtrue` and stores beg and len in `*begp` and `*lenp`\n- `out`: the function returns `Qnil` (the C label `out_of_range`)","proof":"","lean":"","src":""},"b7":{"id":"b7","title":"Inductive type: the result of an implementation model (ChkOut)","math":"`Out` plus a third case `overflow` (the model hit signed overflow). Used for models that detect overflow.","proof":"","lean":"","src":""},"b8":{"id":"b8","title":"Definition: embedding Out into ChkOut","math":"Maps `ok b l` to `ok b l` and `out` to `out`. It lets the specification S (which returns `Out`) be compared with the implementation models (which return `ChkOut`).","proof":"","lean":"","src":""}},"lean/CrubyRange/Cases.lean":{"b1":{"id":"b1","title":"Module doc: concrete inputs","math":"Concrete inputs used by the known answers, the proofs and the non-vacuity checks (checks that the hypotheses of a statement can actually be met).","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"Definition: caseEndMax (`[1,2][0..LONG_MAX]`)","math":"$b = 0,\\ e = \\mathrm{MAX}$, end included, $n = 2,\\ err = 0$: the Ruby expression `[1,2][0..LONG_MAX]`.","proof":"","lean":"","src":""},"b4":{"id":"b4","title":"Definition: caseDouble (two wrap-arounds)","math":"$b = -1,\\ e = \\mathrm{MAX}$, end included, $n = 2,\\ err = 1$: the range `-1..LONG_MAX` used with err = 1 (e.g. `values_at`). The 64-bit arithmetic wraps around twice.","proof":"","lean":"","src":""},"b5":{"id":"b5","title":"Definition: caseNormal (an ordinary read)","math":"$b = 0,\\ e = 1$, end included, $n = 2,\\ err = 0$: `[1,2][0..1]`, an ordinary read with no overflow.","proof":"","lean":"","src":""},"b6":{"id":"b6","title":"Definition: caseO2 (an instance of O2)","math":"$b = \\mathrm{MAX},\\ e = \\mathrm{MIN}$, end included, $n = 2,\\ err = 1$: the range `LONG_MAX..LONG_MIN`, which meets the overflow condition O2.","proof":"","lean":"","src":""}},"lean/CrubyRange/Spec.lean":{"b1":{"id":"b1","title":"Module doc: the specification S","math":"A specification over mathematical integers that does not depend on the statement order of the C code. `PROPERTIES.md` gives it in prose.","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"Definition: the normalized start B","math":"With $b_0$ the start (0 if `nil`):\n$$B = \\begin{cases} b_0 + n & (b_0 < 0) \\\\ b_0 & (b_0 \\ge 0) \\end{cases}$$\nNegative values count from the end.","proof":"","lean":"","src":""},"b4":{"id":"b4","title":"Definition: the normalized (exclusive) end E","math":"If the end is `nil` (an endless range), $E = n$. Otherwise normalize the end e to $e' = e + n$ when $e < 0$ and $e' = e$ otherwise, and\n$$E = e' + \\begin{cases} 0 & (\\text{end excluded}) \\\\ 1 & (\\text{end included}) \\end{cases}$$\nSo E is one past the last index.","proof":"","lean":"","src":""},"b5":{"id":"b5","title":"Definition: the specification S (the intended interval)","math":"$$S(i) = \\begin{cases} \\mathrm{out} & (B < 0) \\\\ \\mathrm{ok}\\bigl(B,\\ \\max(E - B,\\ 0)\\bigr) & (err = 1) \\\\ \\mathrm{out} & (n < B) \\\\ \\mathrm{ok}\\bigl(B,\\ \\max(\\min(E, n) - B,\\ 0)\\bigr) & (\\text{otherwise}) \\end{cases}$$\n\n- err ∈ {0, 2}: the selected indices are $[B, E) \\cap [0, n)$; a start past the end is out of range.\n- err = 1: the interval $[B, E)$ is not clipped at n (it may extend the receiver).\n\nS always returns this mathematical interval. It does not model what should happen when the interval does not fit in `long` (for err = 1, len or B + len above `LONG_MAX`), and it never raises. Whether the results are representable is examined separately (`P1_repr`, `P4`).","proof":"","lean":"`max (E - B) 0` keeps the length non-negative. All comparisons and arithmetic are in `Int` (unbounded integers), so nothing overflows here.","src":""}},"lean/CrubyRange/Impl.lean":{"b1":{"id":"b1","title":"Module doc: the implementation models M_chk and M_wrap","math":"Both follow `rb_range_component_beg_len` (range.c, ruby/ruby 1f2a4bd) statement by statement; they differ only in how a `long` addition or subtraction behaves.\n\nThe quoted C code does the following:\n\n1. Take the start beg (0 if nil) and the end end (−1 if nil). If the end is nil, treat the end as not excluded.\n2. If beg < 0, add len; if it is still negative, the range is out of range.\n3. If end < 0, add len.\n4. If the end is included, increment end.\n5. If err is 0 or 2: beg > len means out of range, and end > len is clipped to len.\n6. len = end − beg, or 0 if negative.","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"Definition: checked long arithmetic","math":"$$\\mathrm{checked}(x) = \\begin{cases} \\mathrm{some}\\ x & (\\mathrm{MIN} \\le x \\le \\mathrm{MAX}) \\\\ \\mathrm{none} & (\\text{otherwise: signed overflow}) \\end{cases}$$","proof":"","lean":"","src":""},"b4":{"id":"b4","title":"Definition: wrap-around to 64 bits","math":"$$\\mathrm{wrap64}(x) = \\bigl((x - \\mathrm{MIN}) \\bmod 2^{64}\\bigr) + \\mathrm{MIN}$$\nThe two's-complement wrap-around to 64 bits. The result always lies in $[\\mathrm{MIN}, \\mathrm{MAX}]$.","proof":"","lean":"`%` is `Int.emod`, which is non-negative for a positive divisor; that is why the result stays between $\\mathrm{MIN}$ and $\\mathrm{MAX}$.","src":""},"b5":{"id":"b5","title":"Definition: the function body, parameterized by the arithmetic","math":"arith gives the result of a `long` addition or subtraction (`none` means overflow). For an input i:\n\n1. $b_0$ = the start (0 if nil), $e_0$ = the end (−1 if nil). If the end is nil, treat it as not excluded.\n2. $\\mathit{beg} = \\mathrm{arith}(b_0 + n)$ if $b_0 < 0$, else $\\mathit{beg} = b_0$. If $\\mathit{beg} < 0$, the result is `out`.\n3. $e_1 = \\mathrm{arith}(e_0 + n)$ if $e_0 < 0$, else $e_1 = e_0$.\n4. $e_2 = \\mathrm{arith}(e_1 + 1)$ if the end is included, else $e_2 = e_1$.\n5. If err ∈ {0, 2}: $n < \\mathit{beg}$ gives `out`, and $e_3 = n$ when $e_2 > n$ (otherwise $e_3 = e_2$).\n6. $l = \\mathrm{arith}(e_3 - \\mathit{beg})$; the result is $\\mathrm{ok}(\\mathit{beg},\\ \\max(l, 0))$.\n\nIf arith returns `none` at any step, the result is `overflow`.","proof":"","lean":"`match … with | none => … | some x => …` splits on the result of each operation. `i.b.getD 0` takes the value out of the Option, using 0 for `none`. `&&` in `clip && i.n < beg` is Boolean \"and\".","src":"Each `--` comment quotes the range.c statement being modeled; the body corresponds statement by statement to the C code quoted in the module doc."},"b6":{"id":"b6","title":"Definition: M_chk (checked)","math":"$M_{chk}(i) = \\mathrm{body}(\\mathrm{checked}, i)$. Every `long` operation is checked, and leaving $[\\mathrm{MIN}, \\mathrm{MAX}]$ gives `overflow`. Conservative with respect to the C semantics.","proof":"","lean":"","src":""},"b7":{"id":"b7","title":"Definition: M_wrap (64-bit wrap-around)","math":"$M_{wrap}(i) = \\mathrm{body}(x \\mapsto \\mathrm{some}(\\mathrm{wrap64}(x)), i)$. Every `long` operation wraps around modulo $2^{64}$; it never returns `overflow`.","proof":"","lean":"It matches the generated code only when `-fno-strict-overflow` is in effect (CRuby's configure adds it; checked with gcc 13 and clang 18). Without it, signed overflow is undefined behavior and this model does not apply.","src":""}},"lean/CrubyRange/Statements.lean":{"b1":{"id":"b1","title":"Module doc: propositions P1–P4 (statements only)","math":"These are `Prop` definitions, not theorems: they say exactly what is proved or refuted. The proofs are in `CrubyRange/Proofs.lean`. All arithmetic and comparisons are over `Int` (no wrap-around).","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"Heading: P1, agreement with the specification (main goal)","math":"","proof":"","lean":"","src":""},"b4":{"id":"b4","title":"Proposition P1: wherever M_chk does not overflow, it agrees with S","math":"$$\\forall i,\\quad \\mathrm{Valid}(i) \\;\\wedge\\; M_{chk}(i) \\ne \\mathrm{overflow} \\;\\Longrightarrow\\; M_{chk}(i) = S(i)$$","proof":"","lean":"`(spec i).toChk` on the right is the result of S (an `Out`) embedded into `ChkOut`.","src":""},"b5":{"id":"b5","title":"Proposition P1_repr: for err ∈ {0, 2}, the result of S fits in long","math":"$$\\forall i,\\quad \\mathrm{Valid}(i) \\wedge err \\ne 1 \\wedge S(i) = \\mathrm{ok}(b, l) \\;\\Longrightarrow\\; \\mathrm{MIN} \\le b \\le \\mathrm{MAX} \\;\\wedge\\; \\mathrm{MIN} \\le l \\le \\mathrm{MAX}$$","proof":"","lean":"","src":""},"b6":{"id":"b6","title":"Heading: P3, arithmetic safety (main goal)","math":"","proof":"","lean":"","src":""},"b7":{"id":"b7","title":"Definition: overflow condition O1","math":"$$O_1(i) :\\iff 0 \\le B \\;\\wedge\\; e = \\mathrm{MAX} \\;\\wedge\\; \\text{end included}$$\n`end++` overflows for a range whose end is `LONG_MAX`.","proof":"","lean":"","src":"`end++` at range.c:1925."},"b8":{"id":"b8","title":"Definition: overflow condition O2 (err = 1 only)","math":"$$O_2(i) :\\iff err = 1 \\;\\wedge\\; 0 \\le B \\;\\wedge\\; E - B < \\mathrm{MIN}$$\n`end - beg` falls below `LONG_MIN`.","proof":"","lean":"","src":"`end - beg` at range.c:1932."},"b9":{"id":"b9","title":"Proposition P3: M_chk overflows exactly on O1 and O2","math":"$$\\forall i,\\quad \\mathrm{Valid}(i) \\;\\Longrightarrow\\; \\bigl(M_{chk}(i) = \\mathrm{overflow} \\iff O_1(i) \\vee O_2(i)\\bigr)$$\nBeing an equivalence, it says both that nothing else overflows and that O1 and O2 always do.","proof":"","lean":"","src":""},"b10":{"id":"b10","title":"Corollary P3_safe: common uses never overflow","math":"$$\\forall i,\\quad \\mathrm{Valid}(i) \\wedge err \\ne 1 \\wedge (e \\ne \\mathrm{MAX} \\vee \\text{end excluded}) \\;\\Longrightarrow\\; M_{chk}(i) \\ne \\mathrm{overflow}$$\nFor err ∈ {0, 2}, an exclusive range, or a range whose end is not `LONG_MAX`, never overflows.","proof":"","lean":"","src":""},"b11":{"id":"b11","title":"Heading: P2, saturation at the upper end (element reads only)","math":"","proof":"","lean":"","src":""},"b12":{"id":"b12","title":"Proposition P2(f): the model f saturates at the upper end","math":"$$\\forall i,\\quad \\mathrm{Valid}(i) \\wedge err = 0 \\wedge \\text{end included} \\wedge e = e_0 \\wedge n - 1 \\le e_0 \\;\\Longrightarrow\\; f(i) = f(i[e := \\mathrm{nil}])$$\nAn inclusive range whose end is at or past the last index gives the same result as the endless range (`b..`).","proof":"","lean":"`{ i with e := none }` is i with only the end replaced by `nil`. The statement is about any model f; the comment expects it to hold for S and to fail for M_wrap at `e = LONG_MAX`.","src":""},"b13":{"id":"b13","title":"Heading: P4, output contract (with a survey of what callers rely on)","math":"","proof":"","lean":"","src":""},"b14":{"id":"b14","title":"Definition: a candidate contract on an ok result","math":"For a result $\\mathrm{ok}(\\mathit{beg}, \\mathit{len})$:\n$$0 \\le \\mathit{beg} \\;\\wedge\\; 0 \\le \\mathit{len} \\;\\wedge\\; \\begin{cases} \\mathit{beg} + \\mathit{len} \\le \\mathrm{MAX} & (err = 1) \\\\ \\mathit{beg} \\le n \\;\\wedge\\; \\mathit{beg} + \\mathit{len} \\le n & (\\text{otherwise}) \\end{cases}$$\n`out` and `overflow` are unconstrained.","proof":"","lean":"The sums are computed in `Int`, so the contract itself cannot overflow. `| _ => True` means \"holds unconditionally in the other cases\".","src":""},"b15":{"id":"b15","title":"Proposition P4(f): the model f satisfies the contract","math":"$$\\forall i,\\quad \\mathrm{Valid}(i) \\;\\Longrightarrow\\; \\mathrm{Contract}\\bigl(i, f(i)\\bigr)$$","proof":"","lean":"","src":""}},"lean/CrubyRange/Fixed.lean":{"b1":{"id":"b1","title":"Module doc: the fix under test (ruby/ruby#19824)","math":"`patches/range-beg-len-overflow.patch` (commit d4d80a35 of gotoken/ruby `fix-range-beg-len-overflow`, the head of #19824) changes two statements of `rb_range_component_beg_len`:\n\n- When the end is included, increment `end` only if `end < RB_LEN_MAX`. `RB_LEN_MAX + 1` is not representable, so it saturates instead of overflowing.\n- `len = end > beg ? end - beg : 0;` Since beg is non-negative here, `end - beg` cannot overflow.\n\nIt also documents: \"On success, `*begp` and `*lenp` are non-negative and their sum does not exceed `RB_LEN_MAX`\" (`fix_doc_contract` in `FixedProofs.lean`). `bodyFixed` is `body` with exactly these two changes.","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"Definition: the patched function body","math":"It differs from `body` in two places only:\n\n1. When the end is included: if $e_1 \\ge \\mathrm{MAX}$ then $e_2 = e_1$ (saturation), otherwise $e_2 = \\mathrm{arith}(e_1 + 1)$.\n2. $\\mathit{len} = \\mathrm{arith}(e_3 - \\mathit{beg})$ only when $\\mathit{beg} < e_3$; otherwise $\\mathit{len} = 0$.\n\nThe other steps (normalizing the start and end, clipping for err ∈ {0, 2}) are the same as in `body`.","proof":"","lean":"`decide (MAX ≤ end1)` turns the proposition into a Bool for the `if`. `||` in `excl || …` is Boolean \"or\".","src":""},"b4":{"id":"b4","title":"Definition: the patched M_chk","math":"$M_{chk}^{fixed}(i) = \\mathrm{bodyFixed}(\\mathrm{checked}, i)$: the patched body with checked arithmetic.","proof":"","lean":"","src":""},"b5":{"id":"b5","title":"Definition: the patched M_wrap","math":"$M_{wrap}^{fixed}(i) = \\mathrm{bodyFixed}(x \\mapsto \\mathrm{some}(\\mathrm{wrap64}(x)), i)$: the patched body with 64-bit wrap-around, which is what a GCC build actually runs.","proof":"","lean":"","src":""},"b6":{"id":"b6","title":"Definition: specSat (S with the end capped at LONG_MAX)","math":"With $E' = \\min(E, \\mathrm{MAX})$ and otherwise the same formula as S:\n$$\\mathrm{specSat}(i) = \\begin{cases} \\mathrm{out} & (B < 0) \\\\ \\mathrm{ok}\\bigl(B,\\ \\max(E' - B,\\ 0)\\bigr) & (err = 1) \\\\ \\mathrm{out} & (n < B) \\\\ \\mathrm{ok}\\bigl(B,\\ \\max(\\min(E', n) - B,\\ 0)\\bigr) & (\\text{otherwise}) \\end{cases}$$\nIt differs from S only for err = 1 on O1 inputs, where S's end `LONG_MAX + 1` is not representable as a `long`.","proof":"","lean":"","src":""}}}}</script>
<script>
// ---- core: Lean block splitting, naming, identifier index, prompt building ----
// Pure functions (no DOM). Tested with node.

const STARTER_KW = new Set(("theorem lemma def abbrev structure inductive coinductive class instance axiom axioms opaque " +
  "example namespace section end open variable universe import set_option attribute macro macro_rules syntax " +
  "notation infix infixl infixr prefix postfix elab elab_rules declare_syntax_cat initialize builtin_initialize " +
  "mutual export omit include module irreducible_def register_simp_attr add_decl_doc alias private protected " +
  "noncomputable partial unsafe nonrec local scoped public meta deriving").split(/\s+/));
const STRUCT_KW = new Set("namespace section end open universe import set_option export omit include module mutual".split(" "));
const MODIFIERS = new Set("private protected noncomputable partial unsafe nonrec public meta local scoped".split(" "));
const DECL_KW = ["theorem", "lemma", "def", "abbrev", "structure", "inductive", "coinductive", "class", "instance",
  "axiom", "opaque", "example", "irreducible_def", "variable", "macro", "macro_rules", "syntax", "notation", "infix",
  "infixl", "infixr", "prefix", "postfix", "elab", "elab_rules", "attribute", "alias", "deriving", "initialize",
  "declare_syntax_cat", "register_simp_attr", "add_decl_doc"];

function isStarterLine(line) {
  if (!line || /^\s/.test(line)) return false;
  if (line.startsWith("@[") || line.startsWith("/-") || line.startsWith("--")) return true;
  if (/^#[a-z_]+/.test(line)) return true;
  const m = /^([A-Za-z_]+)\b/.exec(line);
  if (!m) return false;
  if (m[1] === "deriving") return /^deriving\s+instance\b/.test(line);
  return STARTER_KW.has(m[1]);
}

// Scan one line, updating {depth, inStr}. Returns the state after the line.
function scanLine(line, st) {
  let depth = st.depth, inStr = st.inStr;
  for (let i = 0; i < line.length; i++) {
    const c = line[i], n = line[i + 1];
    if (inStr) {
      if (c === "\\") { i++; continue; }
      if (c === '"') inStr = false;
      continue;
    }
    if (depth > 0) {
      if (c === "/" && n === "-") { depth++; i++; }
      else if (c === "-" && n === "/") { depth--; i++; }
      continue;
    }
    if (c === "-" && n === "-") break; // line comment
    if (c === "/" && n === "-") { depth++; i++; continue; }
    if (c === '"') { inStr = true; continue; }
    if (c === "'") { // char literal like '"' or '\n' (but not h' identifiers)
      const prev = line[i - 1] || " ";
      if (!/[A-Za-z0-9_'!?Ͱ-Ͽ₀-ₜ]/.test(prev)) {
        if (n === "\\" && line[i + 3] === "'") { i += 3; continue; }
        if (line[i + 2] === "'") { i += 2; continue; }
      }
    }
  }
  return { depth, inStr };
}

function stripLeading(text) {
  // remove docstring /-- ... -/ , attributes @[...], and line comments at the start
  let t = text;
  for (let guard = 0; guard < 50; guard++) {
    const before = t;
    t = t.replace(/^\s+/, "");
    if (t.startsWith("/--") || (t.startsWith("/-") && !t.startsWith("/-!"))) {
      let d = 0, i = 0;
      for (; i < t.length; i++) {
        if (t[i] === "/" && t[i + 1] === "-") { d++; i++; }
        else if (t[i] === "-" && t[i + 1] === "/") { d--; i++; if (d === 0) { i++; break; } }
      }
      t = t.slice(i);
    } else if (t.startsWith("@[")) {
      let d = 0, i = 1;
      for (; i < t.length; i++) {
        if (t[i] === "[") d++;
        else if (t[i] === "]") { d--; if (d === 0) { i++; break; } }
      }
      t = t.slice(i);
    } else if (t.startsWith("--")) {
      const k = t.indexOf("\n");
      t = k < 0 ? "" : t.slice(k + 1);
    }
    if (t === before) break;
  }
  return t;
}

function headKeyword(text) {
  let t = stripLeading(text);
  for (let g = 0; g < 6; g++) {
    const m = /^([A-Za-z_]+)\b\s*/.exec(t);
    if (!m) return null;
    if (MODIFIERS.has(m[1])) { t = t.slice(m[0].length); continue; }
    if (m[1] === "class" && /^class\s+inductive\b/.test(t)) return "inductive";
    return m[1];
  }
  return null;
}

function declName(text) {
  const t = stripLeading(text).replace(/^(?:(?:private|protected|noncomputable|partial|unsafe|nonrec|public|meta|local|scoped)\s+)*/, "");
  const m = /^(theorem|lemma|def|abbrev|structure|inductive|coinductive|class(?:\s+inductive)?|instance|axiom|opaque|irreducible_def)\b\s*(?:\(\s*priority\s*:=[^)]*\)\s*)?([^\s:({\[⦃]+)?/.exec(t);
  if (!m) return null;
  const nm = m[2];
  if (!nm || nm === "where" || nm === ":=") return null;
  return nm.replace(/^«|»$/g, "");
}

// Split Lean source into blocks.
function splitLean(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  const starts = [0];
  let st = { depth: 0, inStr: false };
  for (let i = 0; i < lines.length; i++) {
    if (i > 0 && st.depth === 0 && !st.inStr && isStarterLine(lines[i])) starts.push(i);
    st = scanLine(lines[i], st);
  }
  starts.push(lines.length);
  // raw chunks
  let raw = [];
  for (let k = 0; k + 1 < starts.length; k++) {
    let a = starts[k], b = starts[k + 1];
    if (a >= b) continue;
    raw.push({ start: a, end: b, lines: lines.slice(a, b) });
  }
  // classify raw chunks
  for (const c of raw) {
    const text = c.lines.join("\n");
    const first = c.lines.find(l => l.trim() !== "") || "";
    const rest = stripLeading(text).trim();
    if (first.trim() === "") c.cls = "blank";
    else if (first.startsWith("/-!")) c.cls = "prose";
    else if ((first.startsWith("/--") || first.startsWith("@[") || first.startsWith("--")) && rest === "") c.cls = "lead";
    else if (first.startsWith("/-") && rest === "") c.cls = "prose";
    else {
      const kw = headKeyword(text);
      c.kw = kw;
      if (kw && STRUCT_KW.has(kw)) c.cls = "struct";
      else if (kw === "noncomputable" || kw === "section") c.cls = "struct";
      else if (/^#/.test(stripLeading(text).trim())) c.cls = "cmd";
      else c.cls = "decl";
    }
  }
  // merge leading docs/attrs/comments into the next chunk; merge consecutive struct chunks
  const merged = [];
  let pendingLead = null;
  for (const c of raw) {
    if (c.cls === "blank") { if (merged.length && !pendingLead) { merged[merged.length - 1].end = c.end; merged[merged.length - 1].lines.push(...c.lines); } else if (pendingLead) { pendingLead.end = c.end; pendingLead.lines.push(...c.lines); } else merged.push(c); continue; }
    if (c.cls === "lead") {
      if (pendingLead) { pendingLead.end = c.end; pendingLead.lines.push(...c.lines); }
      else pendingLead = { start: c.start, end: c.end, lines: [...c.lines] };
      continue;
    }
    let cur = c;
    if (pendingLead) {
      cur = { ...c, start: pendingLead.start, lines: [...pendingLead.lines, ...c.lines] };
      pendingLead = null;
    }
    const prev = merged[merged.length - 1];
    if (prev && prev.cls === "struct" && cur.cls === "struct") {
      prev.end = cur.end; prev.lines.push(...cur.lines); continue;
    }
    merged.push(cur);
  }
  if (pendingLead) merged.push({ ...pendingLead, cls: "prose" });
  // build blocks; trim trailing blank lines for display
  const blocks = [];
  const nsStack = [];
  merged.forEach((c, idx) => {
    let ls = c.lines.slice();
    while (ls.length && ls[ls.length - 1].trim() === "") ls.pop();
    if (!ls.length) return;
    const text = ls.join("\n");
    const b = { id: "b" + blocks.length, start: c.start + 1, end: c.start + ls.length, text, cls: c.cls };
    if (c.cls === "decl") {
      b.kw = headKeyword(text) || c.kw || "decl";
      b.name = declName(text);
      const ns = nsStack.filter(Boolean).join(".");
      if (b.name) b.full = b.name.startsWith("_root_.") ? b.name.slice(7) : (ns ? ns + "." + b.name : b.name);
    }
    if (c.cls === "struct") {
      // track namespaces in order of lines
      for (const l of ls) {
        let m;
        if ((m = /^namespace\s+(\S+)/.exec(l))) nsStack.push(m[1]);
        else if (/^(?:noncomputable\s+)?section\b/.test(l) || /^public\s+section\b/.test(l)) nsStack.push("");
        else if (/^end\b/.test(l)) nsStack.pop();
      }
    }
    blocks.push(b);
  });
  return blocks;
}

// Where the statement of a declaration ends (before the proof / body).
function statementPart(text) {
  // first top-level ":=" (outside comments/strings) or a line starting with "|" / "where"
  let st = { depth: 0, inStr: false };
  const lines = text.split("\n");
  let out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (st.depth === 0 && i > 0 && /^\s*(\||where\b)/.test(l) && !/:=/.test(out.join("\n"))) { return out.join("\n"); }
    // find ':=' not in comment
    let idx = -1, s2 = { ...st };
    for (let j = 0; j < l.length; j++) {
      const c = l[j], n = l[j + 1];
      if (s2.inStr) { if (c === "\\") { j++; continue; } if (c === '"') s2.inStr = false; continue; }
      if (s2.depth > 0) { if (c === "/" && n === "-") { s2.depth++; j++; } else if (c === "-" && n === "/") { s2.depth--; j++; } continue; }
      if (c === "-" && n === "-") break;
      if (c === "/" && n === "-") { s2.depth++; j++; continue; }
      if (c === '"') { s2.inStr = true; continue; }
      if (c === ":" && n === "=") { idx = j; break; }
    }
    if (idx >= 0) { out.push(l.slice(0, idx + 2) + (/:=\s*by\b/.test(l.slice(idx)) ? " by …" : " …")); return out.join("\n"); }
    out.push(l);
    st = scanLine(l, st);
  }
  return out.join("\n");
}

// number of lines of the proof (for collapsing)
function proofSplit(b) {
  if (b.cls !== "decl" || !/^(theorem|lemma|instance|example)$/.test(b.kw)) return null;
  const lines = b.text.split("\n");
  let st = { depth: 0, inStr: false };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const m = /:=\s*by\s*$/.test(stripComment(l)) || /:=\s*$/.test(stripComment(l));
    st = scanLine(l, st);
    if (st.depth === 0 && m) {
      const rest = lines.length - (i + 1);
      if (rest >= 4) return { headLines: i + 1, proofLines: rest };
      return null;
    }
  }
  return null;
}
function stripComment(l) { const k = l.indexOf("--"); return k >= 0 ? l.slice(0, k).trimEnd() : l.trimEnd(); }

const IDENT_RE = /[A-Za-z_α-ωΑ-Ω][A-Za-z0-9_'!?α-ωΑ-Ω₀-₉]*(?:\.[A-Za-z_α-ωΑ-Ω][A-Za-z0-9_'!?α-ωΑ-Ω₀-₉]*)*/g;

function codeOnly(text) {
  // remove comments and strings, keep identifiers in code
  let out = "", st = { depth: 0, inStr: false };
  for (const l of text.split("\n")) {
    let s = "", d = st.depth, inS = st.inStr;
    for (let j = 0; j < l.length; j++) {
      const c = l[j], n = l[j + 1];
      if (inS) { if (c === "\\") { j++; continue; } if (c === '"') inS = false; continue; }
      if (d > 0) { if (c === "/" && n === "-") { d++; j++; } else if (c === "-" && n === "/") { d--; j++; } continue; }
      if (c === "-" && n === "-") break;
      if (c === "/" && n === "-") { d++; j++; continue; }
      if (c === '"') { inS = true; continue; }
      s += c;
    }
    st = { depth: d, inStr: inS };
    out += s + "\n";
  }
  return out;
}

function identifiers(text) {
  const set = new Set();
  const code = codeOnly(text);
  let m; IDENT_RE.lastIndex = 0;
  while ((m = IDENT_RE.exec(code))) set.add(m[0]);
  return set;
}

// Index of declarations: key (full name and each dotted suffix) -> [{path, block}]
function buildIndex(files /* [{path, blocks}] */) {
  const idx = new Map();
  for (const f of files) for (const b of f.blocks) {
    if (!b.full) continue;
    const parts = b.full.split(".");
    for (let k = 0; k < parts.length; k++) {
      const key = parts.slice(k).join(".");
      if (!idx.has(key)) idx.set(key, []);
      const arr = idx.get(key);
      if (!arr.some(e => e.path === f.path && e.block.id === b.id)) arr.push({ path: f.path, block: b });
    }
  }
  return idx;
}

function lookupIdent(idx, tok) {
  if (idx.has(tok)) return idx.get(tok);
  const parts = tok.split(".");
  // dot notation: h.len -> try suffixes
  for (let k = 1; k < parts.length; k++) {
    const key = parts.slice(k).join(".");
    if (key.length >= 3 && idx.has(key)) return idx.get(key);
  }
  return null;
}

function importsOf(src) {
  const out = [];
  for (const l of src.split("\n")) {
    const m = /^(?:public\s+|meta\s+|private\s+)*import\s+(.+)$/.exec(l.trim());
    if (m) for (const mod of m[1].split(/\s+/)) if (mod && !mod.startsWith("--")) out.push(mod.replace(/^all\s+/, ""));
  }
  return out;
}

function modulePath(mod, paths) {
  const tail = "/" + mod.replace(/\./g, "/") + ".lean";
  const exact = mod.replace(/\./g, "/") + ".lean";
  let best = null;
  for (const p of paths) {
    if (p === exact || p.endsWith(tail)) { if (!best || p.length < best.length) best = p; }
  }
  return best;
}

// Collect context: definitions referenced by `blocks` (current file) from other indexed files.
function collectContext(curPath, curBlocks, idx, budget = 24000) {
  const own = new Set(curBlocks.filter(b => b.full).map(b => b.full));
  const toks = new Set();
  for (const b of curBlocks) if (b.cls === "decl") for (const t of identifiers(b.text)) toks.add(t);
  const picked = new Map(); // key path#id -> {path, block}
  const consider = (tokSet, depth) => {
    const found = [];
    for (const t of tokSet) {
      const hits = lookupIdent(idx, t);
      if (!hits || hits.length > 4) continue; // ambiguous short names: skip
      for (const h of hits) {
        if (h.path === curPath && own.has(h.block.full)) continue;
        const key = h.path + "#" + h.block.id;
        if (picked.has(key)) continue;
        picked.set(key, { ...h, depth });
        found.push(h);
      }
    }
    return found;
  };
  const first = consider(toks, 0);
  // one more hop for definitions only
  const second = new Set();
  for (const h of first) if (!/^(theorem|lemma)$/.test(h.block.kw)) for (const t of identifiers(h.block.text)) second.add(t);
  consider(second, 1);
  // order: defs/structures first, then theorems; depth 0 first
  const items = [...picked.values()].sort((a, b) => {
    const ta = /^(theorem|lemma)$/.test(a.block.kw) ? 1 : 0, tb = /^(theorem|lemma)$/.test(b.block.kw) ? 1 : 0;
    return (a.depth - b.depth) || (ta - tb);
  });
  let out = [], used = 0;
  for (const it of items) {
    let body = /^(theorem|lemma|instance)$/.test(it.block.kw) ? statementPart(it.block.text) : it.block.text;
    if (body.length > 2500) body = body.slice(0, 2500) + "\n  …";
    const piece = `-- ${it.path}:${it.block.start}\n${body}\n`;
    if (used + piece.length > budget) continue;
    out.push(piece); used += piece.length;
  }
  return out.join("\n");
}

function fileWithMarkers(blocks) {
  return blocks.map(b => `<<<${b.id} lines ${b.start}-${b.end}${b.name ? " " + b.kw + " " + b.name : (b.cls !== "decl" ? " " + b.cls : "")}>>>\n${b.text}`).join("\n\n");
}

// Group blocks for translation into chunks
function chunkBlocks(blocks, maxChars = 9000, maxBlocks = 10) {
  const out = []; let cur = [], size = 0;
  for (const b of blocks) {
    const s = Math.min(b.text.length, 6000);
    if (cur.length && (size + s > maxChars || cur.length >= maxBlocks)) { out.push(cur); cur = []; size = 0; }
    cur.push(b); size += s;
  }
  if (cur.length) out.push(cur);
  return out;
}

const STYLE_TEXT = {
  brief: "Be brief: title plus the statement in one or two sentences; proof idea in one sentence.",
  normal: "Normal detail: state hypotheses and conclusion precisely; proof idea in 1-3 sentences.",
  detail: "Detailed: state everything precisely, explain the role of each hypothesis, and give the proof as a short numbered argument a mathematician could check (not tactic by tactic)."
};

function buildPrompt({ repoLabel, path, lang, style, blocks, allBlocks, context, fileText, elide }) {
  const whole = !elide && fileText.length <= 50000;
  const fileSection = whole
    ? fileWithMarkers(allBlocks)
    : fileWithMarkers(allBlocks.map(b => (blocks.includes(b) || b.cls !== "decl") ? b : { ...b, text: statementPart(b.text) }));
  const ids = blocks.map(b => b.id).join(", ");
  return `You are helping a reader who knows mathematics and programming, but not Lean 4, read a Lean 4 source file.
Translate each requested block into natural-language mathematics written in ${lang}.

Repository: ${repoLabel}
File: ${path}
Style: ${STYLE_TEXT[style] || STYLE_TEXT.normal}

For each requested block return one JSON object with these string fields:
- "id": the block id (e.g. "b3").
- "title": one short line in ${lang} saying what the block is ("Definition: ...", "Theorem: ...", etc.).
- "math": the content as ordinary mathematics in ${lang}. Use LaTeX inside $...$ for formulas (display math with $$...$$). Keep the variable names of the code. State hypotheses and conclusion explicitly. For a definition give the defining formula or case split; for a structure list its fields and their meaning; for a Prop-valued definition state the proposition it names. Plain text with "- " bullet lines is fine.
- "proof": for theorems/lemmas/instances with a proof, the proof idea in ${lang} (which lemmas, case splits, inductions or arithmetic facts it uses). Do not narrate tactics one by one. Empty string otherwise.
- "lean": notes in ${lang} on Lean-specific meaning a mathematician could misread, only when relevant. Examples: \`/\` on Int is Euclidean division (Int.ediv; rounds toward -∞ for positive divisors) and \`%\` is Int.emod (non-negative for a non-zero divisor); Nat subtraction truncates at 0; Option/some/none, Except/.ok/.error; Prop vs Bool and \`decide\`; dot notation \`r.WF\` = \`Range.WF r\`; implicit {…} and instance […] arguments; coercions ↑; \`sorry\`. Empty string if nothing notable.
- "src": if the block cites external source code or documents (file:line), summarize the correspondence in ${lang}; else "".

Rules:
- Be faithful to the code. Do not invent meaning that is not there. If the meaning depends on a definition you cannot see, say so in "lean".
- Keep Lean identifiers in backticks.
- For prose blocks (module docs, comments) put a translation of the prose in "math" and leave the other fields empty.
- For blocks that are only namespace/open/import/end, give a one-line "title" and leave the rest empty.

Definitions from other files that this file uses (for reference only; do not translate them):
<context>
${context || "(none found)"}
</context>

The file, split into blocks marked <<<id lines a-b ...>>>${whole ? "" : " (proofs of blocks not requested are elided)"}:
<file>
${fileSection}
</file>

Translate these blocks: ${ids}

Reply with only a JSON array with one object per requested block, in that order. Example element:
{"id":"b3","title":"…","math":"…","proof":"","lean":"","src":""}`;
}

function extractJSONArray(text) {
  if (!text) throw new Error("empty");
  const t = text.trim();
  try { const v = JSON.parse(t); return Array.isArray(v) ? v : (Array.isArray(v.blocks) ? v.blocks : [v]); } catch (e) { }
  const fence = /```(?:json)?\s*([\s\S]*?)```/.exec(t);
  if (fence) { try { const v = JSON.parse(fence[1]); if (Array.isArray(v)) return v; } catch (e) { } }
  const a = t.indexOf("["), b = t.lastIndexOf("]");
  if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
  throw new Error("no JSON array in reply");
}

// Recover complete {...} objects from a reply that is not a clean JSON array (e.g. cut short).
function salvageObjects(text) {
  const out = [];
  let depth = 0, start = -1, inS = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inS) { if (c === "\\") { i++; continue; } if (c === '"') inS = false; continue; }
    if (c === '"') { inS = true; continue; }
    if (c === "{") { if (depth === 0) start = i; depth++; }
    else if (c === "}") { depth--; if (depth === 0 && start >= 0) { try { const o = JSON.parse(text.slice(start, i + 1)); if (o && o.id) out.push(o); } catch (e) { } start = -1; } if (depth < 0) depth = 0; }
  }
  return out;
}

function parseObject(text) {
  const t = String(text || "").trim();
  const tryParse = x => { try { const v = JSON.parse(x); return v && typeof v === "object" && !Array.isArray(v) ? v : null; } catch (e) { return null; } };
  let v = tryParse(t); if (v) return v;
  const f = /```(?:json)?\s*([\s\S]*?)```/.exec(t); if (f && (v = tryParse(f[1]))) return v;
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  return a >= 0 && b > a ? tryParse(t.slice(a, b + 1)) : null;
}

function parseReply(text) {
  try { const a = extractJSONArray(text); if (a.length) return a; } catch (e) { }
  return salvageObjects(text || "");
}

// Server-sent events: the data of each complete event in buf, and the incomplete rest.
function splitSSE(buf) {
  const events = [];
  const parts = String(buf).split(/\r\n\r\n|\n\n|\r\r/);
  const rest = parts.pop();
  for (const ev of parts) {
    const data = ev.split(/\r\n|\n|\r/).filter(l => l.startsWith("data:")).map(l => l.slice(5).replace(/^ /, "")).join("\n");
    if (data) events.push(data);
  }
  return { events, rest };
}

// One chunk of a streamed Gemini reply (a GenerateContentResponse) folded into acc.
// Thought summaries are skipped; the last finishReason and modelVersion win.
function foldGemini(acc, d) {
  acc = acc || { text: "", finish: "", model: "", block: "" };
  if (!d) return acc;
  if (d.error) throw new Error("API " + (d.error.code || "") + ": " + (d.error.message || d.error.status || ""));
  if (d.modelVersion) acc.model = d.modelVersion;
  if (d.promptFeedback && d.promptFeedback.blockReason) acc.block = d.promptFeedback.blockReason;
  const c = (d.candidates || [])[0];
  if (c) {
    for (const p of (c.content && c.content.parts) || []) if (!p.thought && typeof p.text === "string") acc.text += p.text;
    if (c.finishReason) acc.finish = c.finishReason;
  }
  return acc;
}

function hashStr(s) { // FNV-1a 32 → base36, two rounds for fewer collisions
  let h1 = 0x811c9dc5, h2 = 0x01000193 ^ s.length;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 ^= c; h1 = Math.imul(h1, 16777619) >>> 0;
    h2 = Math.imul(h2 ^ c, 2246822519) >>> 0; h2 = (h2 << 13 | h2 >>> 19) >>> 0;
  }
  return h1.toString(36) + h2.toString(36);
}

function parseGitHubURL(input) {
  let s = (input || "").trim();
  if (!s) return null;
  s = s.replace(/^git@github\.com:/, "https://github.com/").replace(/\.git$/, "");
  if (/^[\w.-]+\/[\w.-]+$/.test(s)) s = "https://github.com/" + s;
  let u;
  try { u = new URL(s); } catch (e) { return null; }
  if (!/(^|\.)github\.com$/.test(u.hostname)) return null;
  const seg = u.pathname.split("/").filter(Boolean).map(decodeURIComponent);
  if (seg.length < 2) return null;
  const out = { owner: seg[0], repo: seg[1].replace(/\.git$/, ""), refPath: null, kind: null };
  if (seg[2] === "tree" || seg[2] === "blob") { out.kind = seg[2]; out.refPath = seg.slice(3); }
  return out;
}

const CORE = { splitLean, statementPart, proofSplit, identifiers, buildIndex, lookupIdent, importsOf, modulePath,

if (typeof module !== "undefined") module.exports = CORE;

// Lean 4 reading aids: token -> [ja, en]
const GLOSSARY = {
  "∀": ["全称量化「すべての … について」。`∀ x, P x` は「任意の x で P x」。", "Universal quantifier: `∀ x, P x` means P x holds for every x."],
  "∃": ["存在量化「ある … が存在して」。`∃ k, P k`。証明では `⟨k, 証拠⟩` で作り、`obtain ⟨k, hk⟩ := h` で取り出す。", "Existential: `∃ k, P k`. Built with `⟨k, proof⟩`, destructured with `obtain ⟨k, hk⟩ := h`."],
  "→": ["含意「ならば」、または関数の型 `A → B`。命題では `P → Q` は P ならば Q。複数並ぶと右結合（`P → Q → R` = P かつ Q ならば R）。", "Implication or function type. `P → Q → R` reads as 'if P and Q then R' (right-associative)."],
  "↔": ["同値「… のとき、かつそのときに限り」。", "If and only if."],

  "∨": ["選言「または」。`rcases h with h | h` で場合分け。", "Or. Case split with `rcases h with h | h`."],
  "≠": ["「等しくない」。`a ≠ b` は `¬ (a = b)`。", "Not equal: `¬ (a = b)`."],
  "≤": ["以下。", "Less than or equal."], "≥": ["以上。", "Greater than or equal."],
  "⟨": ["無名コンストラクタ `⟨a, b, …⟩`。構造体の値や「かつ」「存在」の証明を組み立てる（分解にも使う）。", "Anonymous constructor `⟨a, b, …⟩`: builds (or destructures) structures, ∧ and ∃ proofs."],

function renderRich(src) {
  if (!src) return "";
  const ph = [];
  const hold = html => { ph.push(html); return `\u0000${ph.length - 1}\u0000`; };
  let s = String(src);
  s = s.replace(/`([^`\n]+)`/g, (_, c) => hold(`<code>${esc(c)}</code>`));
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => hold(`<div class="dm">${renderMath(m.trim(), true)}</div>`));
  s = s.replace(/\\\[([\s\S]+?)\\\]/g, (_, m) => hold(`<div class="dm">${renderMath(m.trim(), true)}</div>`));
  s = s.replace(/(^|[^\\])\$([^$\n]+?)\$/g, (_, pre, m) => pre + hold(renderMath(m, false)));
  s = s.replace(/\\\(([\s\S]+?)\\\)/g, (_, m) => hold(renderMath(m, false)));

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lean 対訳ブラウザ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6e69'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%88%80%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Math&display=swap" rel="stylesheet">
<style>
/* Layout: file tree on the left; each Lean declaration is one row, code left, its mathematical translation right. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --ink: #18202c;
  --muted: #5b6577;
  --line: #d8dde5;
  --accent: #0b6e69;
  --accent-ink: #ffffff;
  --code-bg: #f6f8fa;
  --hl: #fff5c2;
  --k: #6a35c9; --t: #0a6a8a; --ty: #8a4b00; --c: #5f7a5a; --s: #a6400f; --n: #9a3412; --y: #b0186a;
  --theorem: #3f51b5; --def: #0b6e69; --prop: #8a3fb5; --structure: #a35a00; --prose: #6b7280;
  --err: #b42318; --warn: #8a5a00;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  --font-code: "JetBrains Mono", "Noto Sans Math", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --panel: #171c24; --ink: #e5e9f0; --muted: #98a2b3; --line: #2a313c; --accent: #3cc7bb; --accent-ink: #062b28;
    --code-bg: #12171e; --hl: #3a3415;
    --k: #b9a3ff; --t: #62d0f0; --ty: #f0b45e; --c: #8ba585; --s: #f29e74; --n: #f6a37c; --y: #f48fc5;
    --theorem: #8ea2ff; --def: #3cc7bb; --prop: #c99bf0; --structure: #f0b45e; --prose: #9aa3b2;
    --err: #ff8b80; --warn: #f3c46b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --panel: #171c24; --ink: #e5e9f0; --muted: #98a2b3; --line: #2a313c; --accent: #3cc7bb; --accent-ink: #062b28;
  --code-bg: #12171e; --hl: #3a3415;
  --k: #b9a3ff; --t: #62d0f0; --ty: #f0b45e; --c: #8ba585; --s: #f29e74; --n: #f6a37c; --y: #f48fc5;
  --theorem: #8ea2ff; --def: #3cc7bb; --prop: #c99bf0; --structure: #f0b45e; --prose: #9aa3b2;
  --err: #ff8b80; --warn: #f3c46b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.65 var(--font-body); display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
code, pre { font-family: var(--font-code); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .pad { padding: 16px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: 4px; white-space: nowrap; }
.brand b { font-weight: 600; font-size: 16px; letter-spacing: .01em; }
.brand .logo { font-family: var(--font-code); color: var(--accent); font-weight: 600; }
#srcForm { display: flex; flex: 1 1 320px; min-width: 220px; gap: 6px; }
#url { flex: 1; min-width: 0; }
input[type=text], input[type=search], input[type=password], input:not([type]), select, textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; min-height: 34px;
}
textarea { width: 100%; font-family: var(--font-code); font-size: 12px; }
.grp { display: flex; align-items: center; gap: 6px; }
.grp label { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.btn, #srcForm button { display: inline-flex; align-items: center; gap: 4px; min-height: 34px; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover, #srcForm button:hover { border-color: var(--accent); }
.btn.primary, #srcForm button { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn.ghost { background: transparent; }
#engine { font-family: var(--font-code); font-size: 12px; color: var(--accent); }
#engine.off { color: var(--err); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.only-m { display: none; }
.hint { padding: 10px 16px; background: var(--hl); border-bottom: 1px solid var(--line); font-size: 14px; }
.hint a { color: inherit; font-weight: 600; }

/* layout */
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr); }
#side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.repo { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.rl { font-family: var(--font-code); font-size: 13px; font-weight: 600; word-break: break-all; }
.note { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
#filter { margin: 10px 12px 6px; }
#tree { flex: 1; overflow: auto; padding: 4px 6px 12px; font-size: 13.5px; }
#tree details > summary { cursor: pointer; padding: 3px 6px; border-radius: 5px; color: var(--muted); font-family: var(--font-code); font-size: 12.5px; list-style: none; }
#tree details > summary::before { content: "▸ "; } #tree details[open] > summary::before { content: "▾ "; }
#tree .sub { padding-left: 12px; border-left: 1px solid var(--line); margin-left: 9px; }
#tree .f { display: flex; flex-direction: column; align-items: flex-start; width: 100%; text-align: left; border: 0; background: none; padding: 3px 8px; border-radius: 5px; cursor: pointer; font-family: var(--font-code); font-size: 12.5px; }
#tree .f small { color: var(--muted); font-size: 11px; word-break: break-all; }
#tree .f:hover { background: var(--bg); }
#tree .f.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--ink); font-weight: 600; }
.sidefoot { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 12.5px; }
.sidefoot p { margin: 8px 0 0; color: var(--muted); line-height: 1.6; }
.sidefoot a { color: var(--accent); }
.bh button.lines { border: 0; background: none; cursor: pointer; padding: 0; }
.bh button.lines:hover { color: var(--accent); text-decoration: underline; }
#scrim { display: none; }

#main { overflow: auto; min-height: 0; }
.filehead { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); padding: 12px 20px 8px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.fh1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
#path { font-size: 14px; font-weight: 600; word-break: break-all; }
.fh2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { font-size: 12.5px; padding: 2px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-left: auto; }
.seg button { border: 0; background: var(--panel); padding: 5px 11px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
#stop { display: none; } body.busy #stop { display: inline-flex; } body.busy #trFile { opacity: .5; pointer-events: none; }
#status { font-size: 13px; min-height: 1.2em; color: var(--muted); }
#status:empty { display: none; }
#status[data-kind="err"] { color: var(--err); } #status[data-kind="warn"] { color: var(--warn); font-weight: 500; }

/* blocks */
#blocks { padding: 14px 20px 80px; display: grid; gap: 12px; }
.blk { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; scroll-margin-top: 120px; }
.blk.flash { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.blk.c-struct { background: transparent; border-style: dashed; }
.bh { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.c-struct .bh { border-bottom: 0; padding-bottom: 0; }
.bh .lines { margin-left: auto; color: var(--muted); font-family: var(--font-code); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.chip { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 4px; color: var(--chip, var(--prose)); background: color-mix(in srgb, var(--chip, var(--prose)) 13%, transparent); }
.k-theorem, .k-lemma { --chip: var(--theorem); } .k-def, .k-abbrev, .k-instance { --chip: var(--def); } .k-prop { --chip: var(--prop); }
.k-structure, .k-inductive, .k-class { --chip: var(--structure); }
.nm { font-size: 13px; font-weight: 600; word-break: break-all; }
.pair { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.left { background: var(--code-bg); border-right: 1px solid var(--line); min-width: 0; }
.right { min-width: 0; }
#blocks[data-view="lean"] .right { display: none; } #blocks[data-view="lean"] .pair { grid-template-columns: 1fr; } #blocks[data-view="lean"] .left { border-right: 0; }
#blocks[data-view="tr"] .left { display: none; } #blocks[data-view="tr"] .pair { grid-template-columns: 1fr; }
.c-struct .pair { grid-template-columns: 1fr 1fr; }
.c-struct .left { background: transparent; }
pre.code { margin: 0; padding: 10px 12px 10px 0; overflow-x: auto; font-size: 12.8px; line-height: 1.6; tab-size: 2; }
.ln { display: inline-block; width: 4.2ch; padding-right: 1.2ch; text-align: right; color: var(--muted); opacity: .6; user-select: none; -webkit-user-select: none; }
.ln::before { content: attr(data-n); }
.lc .k { color: var(--k); font-weight: 600; } .lc .t { color: var(--t); } .lc .ty { color: var(--ty); } .lc .c { color: var(--c); font-style: italic; }
.lc .s { color: var(--s); } .lc .n { color: var(--n); } .lc .y { color: var(--y); }
.tok { cursor: pointer; border-radius: 3px; }
.tok:hover { background: var(--hl); }
.tok.ref { text-decoration: underline dotted; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--accent) 70%, transparent); }
.proofT { display: block; margin: 0 12px 10px 5.4ch; border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.proofT:hover { color: var(--accent); border-color: var(--accent); }
pre.code.proof { padding-top: 0; }

.tr { padding: 10px 16px 12px; max-width: 72ch; }
.tr.struct p { margin: 0; font-size: 13px; }
.tr.empty { display: flex; align-items: center; gap: 12px; }
.tr.empty p { margin: 0; font-size: 13px; }
.trOne { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 6px; padding: 2px 12px; cursor: pointer; font-size: 13px; }
.trOne.ghost { border-color: var(--line); color: var(--muted); }
.blk.pending .tr.empty p::after { content: " …"; }
.blk.pending { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.tt { margin: 0 0 6px; font-size: 15px; font-weight: 600; line-height: 1.45; text-wrap: balance; }
.mathbody p, .sec p { margin: 0 0 8px; }
.mathbody ul, .mathbody ol, .sec ul, .sec ol { margin: 0 0 8px; padding-left: 1.3em; }
.mathbody .h { font-weight: 600; }
.tr code { -webkit-box-decoration-break: clone; box-decoration-break: clone; font-size: .88em; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; word-break: break-word; }
.dm { overflow-x: auto; margin: 6px 0 10px; }
math { font-size: 1.06em; }
.dm math { display: block; }
.sec { margin-top: 8px; padding: 6px 0 0 10px; border-left: 3px solid var(--line); font-size: 14px; }
.sec .lbl { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin-bottom: 2px; }
.sec.pf { border-left-color: var(--theorem); } .sec.lnote { border-left-color: var(--y); } .sec.sr { border-left-color: var(--structure); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 11.5px; color: var(--muted); font-family: var(--font-code); }

/* popover, modal, toast */
.pop { position: fixed; z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .18); padding: 10px 14px; max-height: 60vh; overflow: auto; font-size: 14px; }
.pop.sheet { left: 8px !important; right: 8px; bottom: 8px; top: auto !important; width: auto !important; max-height: 55vh; }
.pop .pk { font-size: 11px; font-weight: 600; color: var(--muted); }
.pop .pdef + .pdef, .pop .pg { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.pop .pdef:first-child, .pop .pg:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.pop pre.mini { margin: 6px 0; padding: 6px 8px; background: var(--code-bg); border-radius: 6px; font-size: 11.5px; white-space: pre-wrap; }
.pop .ptitle p { margin: 4px 0; }
.pop .jump { margin-top: 4px; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 12.5px; }
.pop p { margin: 4px 0; }
.modal { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .35); display: grid; place-items: center; padding: 16px; }
.modal .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; padding: 18px 20px; display: grid; gap: 12px; }
.modal h2 { margin: 0; font-size: 17px; } .modal h3 { margin: 6px 0 0; font-size: 13.5px; }
.row { display: grid; gap: 4px; } .row.wide { gap: 12px; } .row label { font-size: 13px; color: var(--muted); }
.chk { display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; } .btns.end { justify-content: flex-end; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--panel); padding: 8px 16px; border-radius: 8px; font-size: 13.5px; }
.err { color: var(--err); }

@media (max-width: 820px) {
  body { font-size: 15px; display: block; overflow: auto; height: auto; min-height: 100%; }
  .grp label { display: none; }
  .btn, #srcForm button, select, input[type=text] { min-height: 32px; padding: 4px 10px; font-size: 14px; }
  #main { overflow: visible; }
  .filehead { top: 0; gap: 6px; }
  #meta { display: none; }
  #path { font-size: 12.5px; }
  .seg button { padding: 4px 9px; }
  .only-m { display: inline-flex; } .only-d { display: none; }
  .top { padding: 8px 12px; gap: 8px; }
  .brand b { font-size: 15px; }
  #srcForm { order: 10; flex-basis: 100%; }
  .layout { display: block; }
  #side { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: min(86vw, 330px); transform: translateX(-102%); transition: transform .2s; box-shadow: 0 0 40px rgb(0 0 0 / .25); }
  body.drawer #side { transform: none; }
  body.drawer #scrim { display: block; position: fixed; inset: 0; z-index: 15; background: rgb(0 0 0 / .3); }
  .filehead { padding: 10px 12px 8px; }
  .seg { margin-left: 0; }
  #blocks { padding: 10px 10px 80px; gap: 10px; }
  .pair, .c-struct .pair { grid-template-columns: 1fr; }
  .left { border-right: 0; border-bottom: 1px solid var(--line); }
  #blocks[data-view="both"] .c-struct .left { border-bottom: 0; }
  pre.code { font-size: 12.2px; }
  .tr { padding: 10px 12px 12px; }
}
@media (prefers-reduced-motion: reduce) { #side { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <button id="drawerBtn" class="btn only-m" type="button" data-i="files"></button>
  <div class="brand"><span class="logo" aria-hidden="true">∀↔</span><b>Lean 対訳ブラウザ</b></div>
  <form id="srcForm"><input id="url" type="text" inputmode="url" data-ph="urlPh" aria-label="GitHub URL" autocomplete="off" spellcheck="false"><button type="submit" data-i="open"></button></form>
  <label class="btn" for="zipIn"><span data-i="zip"></span></label><input type="file" id="zipIn" accept=".zip,application/zip" hidden>
  <label class="btn only-d" for="dirIn"><span data-i="folder"></span></label><input type="file" id="dirIn" webkitdirectory multiple hidden>
  <div class="grp"><label for="lang" data-i="lang"></label><select id="lang"></select><input id="otherLang" hidden data-ph="otherLangPh" aria-label="language"></div>
  <div class="grp"><label for="style" data-i="style"></label><select id="style"></select></div>
  <button id="settingsBtn" class="btn" type="button"><span data-i="settings"></span><span aria-hidden="true">·</span><span id="engine"></span></button>
</header>
<div id="hint" class="hint" hidden></div>
<div class="layout">
  <aside id="side">
    <div class="repo"><div id="repoLabel" class="rl"></div><div id="repoCount" class="muted small"></div><p id="repoNote" class="note" hidden></p></div>
    <input id="filter" type="search" data-ph="filter" aria-label="filter">
    <nav id="tree"></nav>
    <div class="sidefoot"><button id="aboutBtn" class="linkbtn" type="button" data-i="about"></button><div id="aboutBox" hidden><p data-i="aboutText"></p><p><b data-i="lic"></b><br>本体 / tool: BSD-2-Clause<br>デモ / demo: Apache-2.0 (python-formalization, © 2026 David Andrews; CPython excerpts under the PSF License)<br>KaTeX (MIT) · JSZip (MIT)</p></div></div>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <div class="filehead">
      <div class="fh1"><button id="back" class="btn ghost" type="button" hidden data-i="back"></button><code id="path"></code><span id="meta" class="muted small"></span><button id="copyLink" class="linkbtn small" type="button" hidden data-i="copyLink"></button></div>
      <div class="fh2">
        <button id="trFile" class="btn primary" type="button" data-i="translateFile"></button>
        <button id="stop" class="btn ghost" type="button" data-i="stop"></button>
        <span id="count" class="pill"></span>
        <div id="viewSeg" class="seg" role="group" aria-label="view"><button type="button" data-v="both" data-i="viewBoth"></button><button type="button" data-v="lean" data-i="viewLean"></button><button type="button" data-v="tr" data-i="viewTr"></button></div>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
    <div id="blocks" data-view="both"></div>
  </main>
</div>
<div id="pop" class="pop" hidden></div>
<div id="settings" class="modal" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <h2 id="sTitle" data-i="settings"></h2>
    <div id="sClaudeRow" class="row"><label for="tier"><span data-i="sEngine"></span>: <span data-i="sClaude"></span></label><select id="tier"></select></div>
    <div id="sApiRow" class="row wide">
      <div class="row"><label for="apiKey" data-i="sApi"></label><input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-…"></div>
      <div class="row"><label for="model" data-i="sModel"></label><input id="model" list="models" autocomplete="off"><datalist id="models"><option value="claude-sonnet-5-5"></option><option value="claude-opus-5-5"></option><option value="claude-haiku-5-5"></option></datalist></div>
      <div class="row"><label for="ghToken" data-i="sGh"></label><input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_…"></div>
      <label class="chk"><input type="checkbox" id="remember"> <span data-i="sRemember"></span></label>
    </div>
    <p id="sNote" class="note"></p>
    <div class="row"><label for="uiLang" data-i="sUi"></label><select id="uiLang"><option value="ja">日本語</option><option value="en">English</option></select></div>
    <h3 data-i="sExport"></h3>
    <p class="note" data-i="sExportHint"></p>
    <div class="btns"><button id="sCopy" class="btn" type="button" data-i="sCopy"></button><button id="sDownload" class="btn" type="button" data-i="sDownload"></button></div>
    <h3 data-i="sImport"></h3>
    <input type="file" id="sImportFile" accept=".json,application/json" aria-label="import file">
    <textarea id="sImportTxt" rows="3" aria-label="import JSON"></textarea>
    <div class="btns"><button id="sImportBtn" class="btn" type="button" data-i="sImport"></button></div>
    <div class="btns end"><button id="sClose" class="btn primary" type="button" data-i="sClose"></button></div>
  </div>
</div>
<div id="toast" hidden></div>

<script type="application/json" id="demo-data">{"label":"Broyojo/python-formalization @ 7d5a5ed（demo）","start":"lean/PyLean/RangeSlice/Length.lean","files":{"lean/PyLean/RangeSlice/Length.lean":"import PyLean.RangeSlice.Spec\n\n/-!\nRange length: the unsigned-long fast path `get_len_of_range` agrees with the\nPyLong slow path of `compute_range_length`, both compute the mathematical\nlength for every Python int, and `len()` raises `OverflowError` exactly when\nthat length exceeds `sys.maxsize`.\n-/\n\nnamespace PyLean.RangeSlice\n\nopen PyLean\n\n/-! ### Arithmetic lemmas -/\n\ntheorem ite_t {c : Prop} [Decidable c] {α : Sort _} {a b : α} (h : c) : (if c then a else b) = a := by\n  simp [h]\n\ntheorem ite_f {c : Prop} [Decidable c] {α : Sort _} {a b : α} (h : ¬c) : (if c then a else b) = b := by\n  simp [h]\n\ntheorem isLen_unique {a b s L₁ L₂ : Int} (h₁ : IsLen a b s L₁) (h₂ : IsLen a b s L₂) :\n    L₁ = L₂ := by\n  obtain ⟨h₁0, h₁⟩ := h₁\n  obtain ⟨h₂0, h₂⟩ := h₂\n  rcases Int.lt_trichotomy L₁ L₂ with h | h | h\n  · have := (h₂ L₁ h₁0).1 h\n    have := (h₁ L₁ h₁0).2 this\n    omega\n  · exact h\n  · have := (h₁ L₂ h₂0).1 h\n    have := (h₂ L₂ h₂0).2 this\n    omega\n\n/-- The slow path computes the mathematical length. -/\ntheorem slow_isLen (a b s : Int) (hs : s ≠ 0) : IsLen a b s (computeRangeLengthSlow a b s) := by\n  unfold computeRangeLengthSlow IsLen InSeq\n  by_cases hp : s > 0\n  · rw [ite_t hp]\n    by_cases hab : a ≥ b\n    · rw [ite_t hab]\n      refine ⟨Int.le_refl 0, fun k hk => ?_⟩\n      have := Int.mul_nonneg hk (Int.le_of_lt hp)\n      rw [ite_t (show (0 : Int) < s from hp)]\n      omega\n    · rw [ite_f hab]\n      have hq := Int.ediv_nonneg (show 0 ≤ b - a - 1 by omega) (Int.le_of_lt hp)\n      refine ⟨by omega, fun k hk => ?_⟩\n      have := Int.le_ediv_iff_mul_le (a := k) (b := b - a - 1) hp\n      rw [ite_t (show (0 : Int) < s from hp)]\n      omega\n  · have hn : s < 0 := by omega\n    rw [ite_f hp]\n    by_cases hab : b ≥ a\n    · rw [ite_t hab]\n      refine ⟨Int.le_refl 0, fun k hk => ?_⟩\n      have := Int.mul_nonpos_of_nonneg_of_nonpos hk (Int.le_of_lt hn)\n      rw [ite_f (show ¬ (0 : Int) < s by omega)]\n      omega\n    · rw [ite_f hab]\n      have hq := Int.ediv_nonneg (show 0 ≤ a - b - 1 by omega) (show 0 ≤ -s by omega)\n      refine ⟨by omega, fun k hk => ?_⟩\n      have := Int.le_ediv_iff_mul_le (a := k) (b := a - b - 1) (show 0 < -s by omega)\n      rw [Int.mul_neg] at this\n      rw [ite_f (show ¬ (0 : Int) < s by omega)]\n      omega\n\n/-- `get_len_of_range` in unsigned long arithmetic equals the PyLong formula\nfor all C `long` arguments with a non-zero step. -/\ntheorem getLenOfRange_eq (lo hi step : Int) (hlo : IsLong lo) (hhi : IsLong hi)\n    (hs : IsLong step) (h0 : step ≠ 0) :\n    getLenOfRange lo hi step = computeRangeLengthSlow lo hi step := by\n  unfold IsLong longMin longMax at hlo hhi hs\n  unfold getLenOfRange computeRangeLengthSlow\n  by_cases h1 : step > 0 ∧ lo < hi\n  · rw [ite_t h1, ite_t h1.1, ite_f (show ¬ lo ≥ hi by omega)]\n    have hX : usub (usub (toU hi) 1) (toU lo) = hi - lo - 1 := by\n      unfold usub toU two64; omega\n    have hS : toU step = step := by unfold toU two64; omega\n    rw [hX, hS]\n    have hq := Int.ediv_le_self step (show 0 ≤ hi - lo - 1 by omega)\n    have hq0 := Int.ediv_nonneg (show 0 ≤ hi - lo - 1 by omega) (show 0 ≤ step by omega)\n    unfold uadd two64\n    omega\n  · rw [ite_f h1]\n    by_cases h2 : step < 0 ∧ lo > hi\n    · rw [ite_t h2, ite_f (show ¬ step > 0 by omega), ite_f (show ¬ hi ≥ lo by omega)]\n      have hX : usub (usub (toU lo) 1) (toU hi) = lo - hi - 1 := by\n        unfold usub toU two64; omega\n      have hS : usub 0 (toU step) = -step := by unfold usub toU two64; omega\n      rw [hX, hS]\n      have hq := Int.ediv_le_self (-step) (show 0 ≤ lo - hi - 1 by omega)\n      have hq0 := Int.ediv_nonneg (show 0 ≤ lo - hi - 1 by omega) (show 0 ≤ -step by omega)\n      unfold uadd two64\n      omega\n    · rw [ite_f h2]\n      by_cases hp : step > 0\n      · rw [ite_t hp, ite_t (show lo ≥ hi by omega)]\n      · rw [ite_f hp, ite_t (show hi ≥ lo by omega)]\n\n/-! ### Properties -/\n\n/-- Fast path vs slow path: whenever `compute_range_length_long` (the C\n`long` fast path, rangeobject.c:202-236) produces a length, it equals what the\nPyLong slow path (rangeobject.c:273-315) computes for the same arguments.\nHypothesis `step ≠ 0` is a documented precondition (`get_len_of_range`\nasserts it; `validate_step` guarantees it). -/\ndef RangeLengthFastSlow : Prop :=\n  ∀ start stop step len : Int, step ≠ 0 →\n    computeRangeLengthLong start stop step = some len →\n    len = computeRangeLengthSlow start stop step\n\ntheorem rangeLengthFastSlow_proven : RangeLengthFastSlow := by\n  intro start stop step len h0 h\n  unfold computeRangeLengthLong asLong at h\n  by_cases ha : IsLong start <;> by_cases hb : IsLong stop <;> by_cases hc : IsLong step <;>\n    simp [ha, hb, hc] at h\n  obtain ⟨-, rfl⟩ := h\n  exact getLenOfRange_eq start stop step ha hb hc h0\n\ntheorem computeRangeLength_eq_slow (start stop step : Int) (h0 : step ≠ 0) :\n    computeRangeLength start stop step = computeRangeLengthSlow start stop step := by\n  unfold computeRangeLength\n  split\n  · rename_i len h\n    exact rangeLengthFastSlow_proven start stop step len h0 h\n  · rfl\n\ntheorem computeRangeLength_isLen (start stop step : Int) (h0 : step ≠ 0) :\n    IsLen start stop step (computeRangeLength start stop step) := by\n  rw [computeRangeLength_eq_slow _ _ _ h0]; exact slow_isLen _ _ _ h0\n\ntheorem Range.WF.len {r : Range} (h : r.WF) : r.Len r.length := by\n  unfold Range.Len; rw [h.2]; exact computeRangeLength_isLen _ _ _ h.1\n\ntheorem Range.WF.length_eq {r : Range} (h : r.WF) {L : Int} (hL : r.Len L) : r.length = L :=\n  isLen_unique h.len hL\n\ntheorem makeRangeObject_wf (a b s : Int) (h : s ≠ 0) : (makeRangeObject a b s).WF :=\n  ⟨h, rfl⟩\n\ntheorem rangeNew_wf {a b : Int} {s : Option Int} {r : Range} (h : rangeNew a b s = .ok r) :\n    r.WF := by\n  unfold rangeNew validateStep at h\n  cases s with\n  | none => simp [bind, Except.bind, pure, Except.pure] at h; subst h; exact makeRangeObject_wf _ _ _ (by decide)\n  | some v =>\n    by_cases hv : v = 0\n    · simp [hv, bind, Except.bind] at h\n    · simp [hv, bind, Except.bind, pure, Except.pure] at h; subst h; exact makeRangeObject_wf _ _ _ hv\n\ntheorem range1_wf (b : Int) : (range1 b).WF := makeRangeObject_wf _ _ _ (by decide)\n\n/-- `range(start, stop, step)` raises `ValueError` for a zero step and\notherwise stores the mathematical length, for every Python int; no argument\nis too large. -/\ndef RangeNewLength : Prop :=\n  ∀ (start stop : Int) (step : Option Int),\n    (step = some 0 → rangeNew start stop step = .error (.valueError \"range() arg 3 must not be zero\")) ∧\n    (step ≠ some 0 → ∃ r, rangeNew start stop step = .ok r ∧ r.start = start ∧ r.stop = stop ∧\n      r.step = step.getD 1 ∧ r.Len r.length)\n\ntheorem rangeNewLength_proven : RangeNewLength := by\n  intro start stop step\n  refine ⟨fun h => by subst h; rfl, fun h => ?_⟩\n  have hs : step.getD 1 ≠ 0 := by\n    cases step with\n    | none => decide\n    | some v => simp only [Option.getD_some]; intro hv; exact h (by rw [hv])\n  refine ⟨makeRangeObject start stop (step.getD 1), ?_, rfl, rfl, rfl,\n    (makeRangeObject_wf _ _ _ hs).len⟩\n  unfold rangeNew validateStep\n  cases step with\n  | none => rfl\n  | some v =>\n    have : v ≠ 0 := fun hv => h (by rw [hv])\n    simp [this, bind, Except.bind, pure, Except.pure]\n\n/-- `len(r)` returns the mathematical length `L` when `L <= sys.maxsize` and\nraises `OverflowError` otherwise (\"Ranges containing absolute values larger\nthan sys.maxsize are permitted but some features (such as len()) may raise\nOverflowError\", Doc/builtins/stdtypes.rst:1817-1819). `r.WF` is the type invariant. -/\ndef LenOverflow : Prop :=\n  ∀ (r : Range) (L : Int), r.WF → r.Len L →\n    rangeLength r = if L ≤ ssizeMax then .ok L else .error ssizeOverflow\n\ntheorem lenOverflow_proven : LenOverflow := by\n  intro r L hw hL\n  rw [← hw.length_eq hL]\n  rfl\n\n/-- Every length path is exact. For C `long` arguments with a non-zero step (it asserts\n`step != 0`), `get_len_of_range` (rangeobject.c:992-1014) returns the mathematical length;\n`compute_range_length_long` (:202-236) answers exactly when all three arguments fit a `long`\nand that length is at most `LONG_MAX`, and then with that length; the PyLong slow path of\n`compute_range_length` (:273-315) returns the mathematical length for all Python ints; and so\ndoes `compute_range_length` itself (:243-323), whichever path it takes. `IsLen` fixes a\nunique value (`isLen_unique`), so a slow path returning 0 for big arguments, or a\n`get_len_of_range` returning `ULONG_MAX`, fails this. The step is non-zero by `validate_step`\n(a documented precondition of all three functions). -/\ndef RangeLengthExact : Prop :=\n  (∀ lo hi step : Int, IsLong lo → IsLong hi → IsLong step → step ≠ 0 →\n    IsLen lo hi step (getLenOfRange lo hi step)) ∧\n  (∀ start stop step L : Int, step ≠ 0 → IsLen start stop step L →\n    computeRangeLengthLong start stop step =\n      if IsLong start ∧ IsLong stop ∧ IsLong step ∧ L ≤ longMax then some L else none) ∧\n  (∀ start stop step : Int, step ≠ 0 → IsLen start stop step (computeRangeLengthSlow start stop step)) ∧\n  (∀ start stop step : Int, step ≠ 0 → IsLen start stop step (computeRangeLength start stop step))\n\ntheorem rangeLengthExact_proven : RangeLengthExact := by\n  refine ⟨fun lo hi step h1 h2 h3 h0 => ?_, fun start stop step L h0 hL => ?_,\n    fun a b s h0 => slow_isLen a b s h0, fun a b s h0 => computeRangeLength_isLen a b s h0⟩\n  · rw [getLenOfRange_eq lo hi step h1 h2 h3 h0]; exact slow_isLen _ _ _ h0\n  · have hsl := isLen_unique (slow_isLen start stop step h0) hL\n    unfold computeRangeLengthLong asLong\n    by_cases ha : IsLong start <;> by_cases hb : IsLong stop <;> by_cases hc : IsLong step <;>\n      simp [ha, hb, hc]\n    rw [getLenOfRange_eq _ _ _ ha hb hc h0, hsl]\n    by_cases hL' : L ≤ longMax\n    · simp [hL', show ¬ L > longMax by omega]\n    · simp [hL', show L > longMax by omega]\n\nend PyLean.RangeSlice\n","lean/PyLean/RangeSlice/Spec.lean":"import PyLean.RangeSlice.Model\n\n/-!\nMathematical vocabulary for `range` properties: the k-th element\n`start + k*step`, and the length characterised without any division: `L` is\nthe length of `range(start, stop, step)` when exactly the indices `0 <= k < L`\ngive elements strictly before `stop` in the direction of `step`.\n-/\n\nnamespace PyLean.RangeSlice\n\n/-- `start + k*step` lies strictly before `stop` in the direction of `step`. -/\ndef InSeq (start stop step k : Int) : Prop :=\n  if 0 < step then start + k * step < stop else stop < start + k * step\n\n/-- `L` is the number of elements of `range(start, stop, step)`. -/\ndef IsLen (start stop step L : Int) : Prop :=\n  0 ≤ L ∧ ∀ k, 0 ≤ k → (k < L ↔ InSeq start stop step k)\n\n/-- The k-th element of the mathematical sequence. -/\ndef Range.elem (r : Range) (k : Int) : Int := r.start + k * r.step\n\n/-- Type invariant of every `rangeobject`: `make_range_object` (rangeobject.c:66-88)\nstores `compute_range_length` in `length`, and the step is non-zero\n(`validate_step`, or the product of two non-zero steps in `compute_slice`). -/\ndef Range.WF (r : Range) : Prop :=\n  r.step ≠ 0 ∧ r.length = computeRangeLength r.start r.stop r.step\n\n/-- The mathematical length of `r`. -/\ndef Range.Len (r : Range) (L : Int) : Prop := IsLen r.start r.stop r.step L\n\n/-- `x` is one of the elements of `r` whose length is `L`. -/\ndef Range.MemL (r : Range) (L x : Int) : Prop := ∃ k, 0 ≤ k ∧ k < L ∧ x = r.elem k\n\nend PyLean.RangeSlice\n","lean/PyLean/RangeSlice/Model.lean":"import PyLean.Core\n\n/-!\nModel of the C builtins `range` (`Objects/rangeobject.c`) and `slice`\n(`Objects/sliceobject.c`) of CPython 3.15.2, plus the two `listobject.c`\nfunctions that consume `PySlice_Unpack`/`PySlice_AdjustIndices`. The critical\nsections 3.15 put around the iterator methods do not change what one thread sees,\nand free-threaded builds are out of scope.\n\nScope and conventions:\n\n* LP64: `long`, `Py_ssize_t` and `size_t` are 64 bits (macOS/Linux builds).\n* Python ints are `Int`. A C `long` is an `Int` in `[longMin, longMax]`;\n  unsigned long values are `Int`s in `[0, 2^64)` produced by `toU`, and the\n  unsigned operations `uadd`/`usub`/`umul` reduce mod `2^64` exactly as C does.\n  CPython is compiled with `-fno-strict-overflow` (configure.ac:2255-2281),\n  so signed `long` arithmetic that could overflow is modelled with `wrap`\n  (two's complement); the properties show where that never happens.\n* The fields of a `rangeobject` are exact ints: `PyNumber_Index` returns exact ints\n  (Objects/abstract.c:1456-1463), so this file works on `Int`. The objects a caller\n  passes (to `range(...)`, `r[...]`, `in`, `count`, `index`, `==`) are modelled in\n  `RangeSlice/Objects.lean` and `RangeSlice/Search.lean`, with fallible `__index__` and\n  `__eq__` callbacks. Slice parts are ints or `None` here.\n* A range object is created only through `makeRangeObject`, which stores\n  `compute_range_length` in the `length` field, as `make_range_object` does.\n-/\n\nnamespace PyLean.RangeSlice\n\nopen PyLean\n\n/-! ## C integer helpers -/\n\ndef two64 : Int := 18446744073709551616\ndef longMin : Int := -9223372036854775808\ndef longMax : Int := 9223372036854775807\n\n/-- `x` fits in a C `long`. -/\ndef IsLong (x : Int) : Prop := longMin ≤ x ∧ x ≤ longMax\n\ninstance (x : Int) : Decidable (IsLong x) := inferInstanceAs (Decidable (_ ∧ _))\n\n/-- `(unsigned long)x`. -/\ndef toU (x : Int) : Int := x % two64\n\n/-- Unsigned long `a + b`, `a - b`, `a * b` (wrapping mod `2^64`). -/\ndef uadd (a b : Int) : Int := (a + b) % two64\ndef usub (a b : Int) : Int := (a - b) % two64\ndef umul (a b : Int) : Int := (a * b) % two64\n\n/-- `(long)x` and signed `long` arithmetic under `-fno-strict-overflow`:\ntwo's complement wraparound. -/\ndef wrap (x : Int) : Int :=\n  if x % two64 > longMax then x % two64 - two64 else x % two64\n\n/-- `PyLong_AsLongAndOverflow` / `PyLong_AsLong` on an exact int: `none`\nis the overflow case (`overflow != 0`, resp. `OverflowError` set). -/\ndef asLong (x : Int) : Option Int := if IsLong x then some x else none\n\n/-! ## Range objects -/\n\n/-- `rangeobject`, rangeobject.c:35-41. All four fields are PyLongs. -/\nstructure Range where\n  start : Int\n  stop : Int\n  step : Int\n  length : Int\n  deriving Repr, DecidableEq, Inhabited\n\n/-- `get_len_of_range`, rangeobject.c:992-1014, in unsigned long arithmetic.\n`hi - 1UL - lo` converts `hi` and `lo` to unsigned long; `/ step` converts\n`step` to unsigned long. -/\ndef getLenOfRange (lo hi step : Int) : Int :=\n  if step > 0 ∧ lo < hi then\n    uadd 1 (usub (usub (toU hi) 1) (toU lo) / toU step)\n  else if step < 0 ∧ lo > hi then\n    uadd 1 (usub (usub (toU lo) 1) (toU hi) / usub 0 (toU step))\n  else 0\n\n/-- `compute_range_length_long`, rangeobject.c:202-236. `none` is the\n`-2` (\"overflow\") return; the `-1` error return cannot happen for ints. -/\ndef computeRangeLengthLong (start stop step : Int) : Option Int := do\n  let lstart ← asLong start\n  let lstop ← asLong stop\n  let lstep ← asLong step\n  let ulen := getLenOfRange lstart lstop lstep\n  if ulen > longMax then none else some ulen\n\n/-- The PyLong part of `compute_range_length`, rangeobject.c:273-315:\n`(lo, hi, step)` is `(start, stop, step)` for a positive step and\n`(stop, start, -step)` otherwise; then `0` if `lo >= hi`, else\n`(hi - lo - 1) // step + 1`. `PyNumber_FloorDivide` by the positive step is\n`Int.ediv`. (A zero step never reaches this function: `validate_step` rejects\nit and slicing multiplies two non-zero steps.) -/\ndef computeRangeLengthSlow (start stop step : Int) : Int :=\n  if step > 0 then (if start ≥ stop then 0 else (stop - start - 1) / step + 1)\n  else (if stop ≥ start then 0 else (start - stop - 1) / (-step) + 1)\n\n/-- `compute_range_length`, rangeobject.c:243-323: the `long` fast path,\nthen the PyLong slow path. -/\ndef computeRangeLength (start stop step : Int) : Int :=\n  match computeRangeLengthLong start stop step with\n  | some len => len\n  | none => computeRangeLengthSlow start stop step\n\n/-- `make_range_object`, rangeobject.c:67-88. -/\ndef makeRangeObject (start stop step : Int) : Range :=\n  ⟨start, stop, step, computeRangeLength start stop step⟩\n\n/-- `validate_step`, rangeobject.c:47-61, for an argument already converted by `PyNumber_Index` (the object-level model is `validateStepObj`, RangeSlice/Objects.lean). `none` is an omitted step. -/\ndef validateStep : Option Int → Py Int\n  | none => .ok 1\n  | some s => if s = 0 then .error (.valueError \"range() arg 3 must not be zero\") else .ok s\n\n/-- `range(start, stop[, step])`, `range_from_array` cases 3 and 2,\nrangeobject.c:105-122 and :141, after the `PyNumber_Index` conversions (`rangeFrom23`, RangeSlice/Objects.lean, is the object-level model). -/\ndef rangeNew (start stop : Int) (step : Option Int) : Py Range := do\n  let st ← validateStep step\n  return makeRangeObject start stop st\n\n/-- `range(stop)`, `range_from_array` case 1, rangeobject.c:123-130. -/\ndef range1 (stop : Int) : Range := makeRangeObject 0 stop 1\n\n/-- `PyLong_AsSsize_t` overflow message, Objects/longobject.c:748. -/\ndef ssizeOverflow : PyExc := .overflowError \"Python int too large to convert to C ssize_t\"\n\n/-- `len(r)`: `range_length`, rangeobject.c:325-330 (`PyLong_AsSsize_t`). -/\ndef rangeLength (r : Range) : Py Int :=\n  if r.length ≤ ssizeMax then .ok r.length else .error ssizeOverflow\n\n/-- `compute_item`, rangeobject.c:332-351: `start + i * step` (the\n`step == 1` branch skips the multiplication). -/\ndef computeItem (r : Range) (i : Int) : Int :=\n  if r.step = 1 then r.start + i else r.start + i * r.step\n\n/-- `compute_range_item`, rangeobject.c:353-404; `r[i]` for an int `i`\n(`range_subscript`, :729-739). -/\ndef computeRangeItem (r : Range) (arg : Int) : Py Int :=\n  let i := if arg < 0 then r.length + arg else arg\n  if i < 0 ∨ i ≥ r.length then .error (.indexError \"range object index out of range\")\n  else .ok (computeItem r i)\n\n/-! ## Slice objects -/\n\n/-- A slice whose parts are ints or `None`. -/\nstructure Slice where\n  start : Option Int\n  stop : Option Int\n  step : Option Int\n  deriving Repr, DecidableEq, Inhabited\n\n/-- The start/stop clipping block of `_PySlice_GetLongIndices`,\nsliceobject.c:444-467 (start) and :469-492 (stop). -/\ndef clipLong (v : Option Int) (dflt lower upper length : Int) : Int :=\n  match v with\n  | none => dflt\n  | some x =>\n    if x < 0 then\n      let y := x + length\n      if y < lower then lower else y\n    else if x > upper then upper else x\n\n/-- `_PySlice_GetLongIndices`, sliceobject.c:396-513, all PyLong. -/\ndef getLongIndices (s : Slice) (length : Int) : Py (Int × Int × Int) := do\n  let (step, neg) ← match s.step with\n    | none => pure (1, false)\n    | some st =>\n      if st = 0 then throw (.valueError \"slice step cannot be zero\") else pure (st, decide (st < 0))\n  let (lower, upper) := if neg then ((-1 : Int), length + -1) else (0, length)\n  let start := clipLong s.start (if neg then upper else lower) lower upper length\n  let stop := clipLong s.stop (if neg then lower else upper) lower upper length\n  return (start, stop, step)\n\n/-- `slice.indices(length)`, `slice_indices`, sliceobject.c:527-552. -/\ndef sliceIndices (s : Slice) (length : Int) : Py (Int × Int × Int) :=\n  if length < 0 then .error (.valueError \"length should not be negative\")\n  else getLongIndices s length\n\n/-- `r[s]`: `compute_slice`, rangeobject.c:418-455. -/\ndef computeSlice (r : Range) (s : Slice) : Py Range := do\n  let (start, stop, step) ← getLongIndices s r.length\n  let substep := r.step * step\n  return makeRangeObject (computeItem r start) (computeItem r stop) substep\n\n/-- `PyNumber_AsSsize_t(v, NULL)`: saturates instead of raising\n(Objects/abstract.c, used by `_PyEval_SliceIndex`, Python/ceval.c:2949). -/\ndef clampSsize (x : Int) : Int := if x < ssizeMin then ssizeMin else if x > ssizeMax then ssizeMax else x\n\n/-- `PySlice_Unpack`, sliceobject.c:218-262. -/\ndef sliceUnpack (s : Slice) : Py (Int × Int × Int) := do\n  let step ← match s.step with\n    | none => pure 1\n    | some v =>\n      let st := clampSsize v\n      if st = 0 then throw (.valueError \"slice step cannot be zero\")\n      pure (if st < -ssizeMax then -ssizeMax else st)\n  let start := match s.start with\n    | none => if step < 0 then ssizeMax else 0\n    | some v => clampSsize v\n  let stop := match s.stop with\n    | none => if step < 0 then ssizeMin else ssizeMax\n    | some v => clampSsize v\n  return (start, stop, step)\n\n/-- The start/stop adjustment block of `PySlice_AdjustIndices`,\nsliceobject.c:273-291. `x += length` cannot overflow there because\n`x < 0 ≤ length`. -/\ndef adjustOne (x length step : Int) : Int :=\n  if x < 0 then\n    let y := x + length\n    if y < 0 then (if step < 0 then -1 else 0) else y\n  else if x ≥ length then (if step < 0 then length - 1 else length)\n  else x\n\n/-- `PySlice_AdjustIndices`, sliceobject.c:264-304: `(start, stop, slicelength)`.\nC division truncates (`Int.tdiv`). -/\ndef adjustIndices (length start stop step : Int) : Int × Int × Int :=\n  let start := adjustOne start length step\n  let stop := adjustOne stop length step\n  let n :=\n    if step < 0 then (if stop < start then Int.tdiv (start - stop - 1) (-step) + 1 else 0)\n    else (if start < stop then Int.tdiv (stop - start - 1) step + 1 else 0)\n  (start, stop, n)\n\n/-- The positions `list[s]` reads for a list of length `n`:\n`list_slice_subscript` and `list_slice_wrap`, Objects/listobject.c:3674-3703,\nwith `list_slice_lock_held` (:717-738) for `step == 1` and\n`list_slice_step_lock_held` (:3654-3672) otherwise, whose cursor is a\n`size_t` advanced by `(size_t)step`. -/\ndef listSlicePositions (n : Int) (s : Slice) : Py (List Int) := do\n  let (start, stop, step) ← sliceUnpack s\n  let (start, stop, len) := adjustIndices n start stop step\n  if len ≤ 0 then return []\n  else if step = 1 then\n    return (List.range (stop - start).toNat).map (fun (i : Nat) => start + (i : Int))\n  else\n    return (List.range len.toNat).map (fun (i : Nat) => toU (toU start + (i : Int) * toU step))\n\n/-! ## Membership, index, count, comparison, hash -/\n\n/-- `range_contains_long`, rangeobject.c:459-501. -/\ndef rangeContainsLong (r : Range) (ob : Int) : Bool :=\n  let (c2, c3) := if r.step > 0 then (decide (r.start ≤ ob), decide (ob < r.stop))\n    else (decide (ob ≤ r.start), decide (r.stop < ob))\n  if !c2 || !c3 then false\n  else (ob - r.start) % r.step == 0\n\n/-- `r.count(x)` for an int `x`, `range_count`, rangeobject.c:630-646. -/\ndef rangeCount (r : Range) (ob : Int) : Int := if rangeContainsLong r ob then 1 else 0\n\n/-- `r.index(x)` for an int `x`, `range_index`, rangeobject.c:648-685. -/\ndef rangeIndex (r : Range) (ob : Int) : Py Int :=\n  if rangeContainsLong r ob then\n    let idx := ob - r.start\n    if r.step = 1 then .ok idx else .ok (idx / r.step)\n  else .error (.valueError \"range.index(x): x not in range\")\n\n/-- `range_equals`, rangeobject.c:530-553, for two distinct objects (the :534 identity test is in `rangeEqualsObj`, RangeSlice/Objects.lean). -/\ndef rangeEquals (r0 r1 : Range) : Bool :=\n  if r0.length != r1.length then false\n  else if r0.length == 0 then true\n  else if r0.start != r1.start then false\n  else if r0.length == 1 then true\n  else r0.step == r1.step\n\n/-- The tuple `range_hash` hashes, rangeobject.c:594-628:\n`(len, None, None)`, `(len, start, None)` or `(len, start, step)`. -/\ndef rangeHashKey (r : Range) : Int × Option Int × Option Int :=\n  if r.length == 0 then (r.length, none, none)\n  else if r.length == 1 then (r.length, some r.start, none)\n  else (r.length, some r.start, some r.step)\n\n/-! ## Iterators -/\n\n/-- `range_iterator` (`_PyRangeIterObject`, C longs, Include/internal/pycore_range.h)\nand `longrange_iterator` (`longrangeiterobject`, PyLongs, rangeobject.c:12-17). -/\ninductive RIter where\n  | fast (start step len : Int)\n  | long (start step len : Int)\n  deriving Repr, DecidableEq, Inhabited\n\n/-- `type(it).__name__`. -/\ndef RIter.typeName : RIter → String\n  | .fast .. => \"range_iterator\"\n  | .long .. => \"longrange_iterator\"\n\n/-- `rangeiter_next` (rangeobject.c:845-859; same as `_ITER_NEXT_RANGE`,\nPython/bytecodes.c:4082-4095) and `longrangeiter_next` (:1183-1191), which locks and\ncalls `longrangeiter_next_lock_held` (:1161-1181). `result + r->step` is signed\n`long` arithmetic. -/\ndef iterNext : RIter → Option (Int × RIter)\n  | .fast start step len =>\n    if len > 0 then some (start, .fast (wrap (start + step)) step (len - 1)) else none\n  | .long start step len =>\n    if len > 0 then some (start, .long (start + step) step (len - 1)) else none\n\n/-- The next `n` values (fewer if the iterator is exhausted) and the\niterator afterwards. -/\ndef iterTake : Nat → RIter → List Int × RIter\n  | 0, it => ([], it)\n  | n + 1, it =>\n    match iterNext it with\n    | none => ([], it)\n    | some (x, it') => let (xs, it'') := iterTake n it'; (x :: xs, it'')\n\n/-- `it.__length_hint__()`: `range_iterator___length_hint___impl`, rangeobject.c:869-874,\nand `longrange_iterator___length_hint___impl`, :1044-1050. -/\ndef RIter.lengthHint : RIter → Int\n  | .fast _ _ len | .long _ _ len => len\n\n/-- The range inside `it.__reduce__()`: `range_iterator___reduce___impl`,\nrangeobject.c:884-913 (`r->start + r->len * r->step` in signed `long`), and\n`longrange_iterator___reduce___impl`, :1060-1087. -/\ndef iterReduce : RIter → Range\n  | .fast start step len => makeRangeObject start (wrap (start + wrap (len * step))) step\n  | .long start step len => makeRangeObject start (start + len * step) step\n\n/-- `C long` conversion failure message (`PyLong_AsLong`). -/\ndef longOverflow : PyExc := .overflowError \"Python int too large to convert to C long\"\n\n/-- `it.__setstate__(state)` for an exact int `state`:\n`range_iterator___setstate___impl` (rangeobject.c:925-940, `PyLong_AsLong` then\nclip) and `longrange_iterator___setstate___impl` (:1099-1142, clip in PyLong). -/\ndef iterSetstate (it : RIter) (state : Int) : Py RIter :=\n  match it with\n  | .fast start step len =>\n    match asLong state with\n    | none => .error longOverflow\n    | some index =>\n      let index := if index < 0 then 0 else if index > len then len else index\n      .ok (.fast (wrap (start + wrap (index * step))) step (len - index))\n  | .long start step len =>\n    let st := if state < 0 then 0 else if len < state then len else state\n    .ok (.long (start + st * step) step (len - st))\n\n/-- The object passed to `it.__setstate__`. -/\ninductive StateArg where\n  /-- An object whose type is exactly `int`. -/\n  | exact (v : Int)\n  /-- An instance of a proper subclass `tp` of `int`, such as `bool`. -/\n  | subclass (v : Int) (tp : String)\n  /-- Not an `int`; its type `tp` defines `__index__`, which is a callback, with this\n  outcome. An `__index__` that returns a non-int is a `TypeError` outcome. -/\n  | index (r : Py Int) (tp : String)\n  /-- Not an `int`, and its type `tp` has no `__index__`. -/\n  | other (tp : String)\n  deriving Inhabited\n\n/-- `Py_TYPE(state)` as `%T` and `%.200s` print it. -/\ndef StateArg.typeName : StateArg → String\n  | .exact _ => \"int\"\n  | .subclass _ tp | .index _ tp | .other tp => tp\n\n/-- `PyLong_AsLong(state)`, Objects/longobject.c:672-684, through\n`PyLong_AsLongAndOverflow` (:593-667): an `int` of any subclass is read directly,\nanything else goes through `_PyNumber_Index` (Objects/abstract.c:1410-1448). -/\ndef stateAsLong (s : StateArg) : Py Int :=\n  let ofInt (v : Int) : Py Int := match asLong v with\n    | some i => .ok i\n    | none => .error longOverflow\n  match s with\n  | .exact v | .subclass v _ => ofInt v\n  | .index r _ => r >>= ofInt\n  | .other tp => .error (.typeError s!\"'{tp}' object cannot be interpreted as an integer\")\n\n/-- `it.__setstate__(state)` for any object. The two iterators disagree on what they\naccept: `range_iterator___setstate___impl` reads it with `PyLong_AsLong`\n(rangeobject.c:929-931), so it takes `bool` and `__index__`, while\n`longrange_iterator___setstate___impl` starts with `PyLong_CheckExact` (:1103-1106). -/\ndef iterSetstateObj (it : RIter) (state : StateArg) : Py RIter :=\n  match it, state with\n  | .fast .., _ => stateAsLong state >>= iterSetstate it\n  | .long .., .exact v => iterSetstate it v\n  | .long .., _ => .error (.typeError s!\"state must be an int, not {state.typeName}\")\n\n/-- `iter(r)`: `range_iter`, rangeobject.c:1227-1279. -/\ndef rangeIter (r : Range) : RIter :=\n  let slow := RIter.long r.start r.step r.length\n  match asLong r.start, asLong r.stop, asLong r.step with\n  | some lstart, some lstop, some lstep =>\n    let ulen := getLenOfRange lstart lstop lstep\n    if ulen > longMax then slow\n    else if ulen ≠ 0 ∧ (if lstep > 0 then lstop > longMax - (lstep - 1)\n                         else lstop < longMin + (-1 - lstep)) then slow\n    else .fast lstart lstep ulen\n  | _, _, _ => slow\n\n/-- `reversed(r)`: `range_reverse`, rangeobject.c:1282-1384. The slow path\nbuilds `longrange_iterator(start + (len - 1) * step, -step, len)`. -/\ndef rangeReverse (r : Range) : RIter :=\n  let slow := RIter.long (r.start + (r.length - 1) * r.step) (-r.step) r.length\n  match asLong r.start, asLong r.stop, asLong r.step with\n  | some lstart, some lstop, some lstep =>\n    if lstep = longMin then slow\n    else if (if lstep > 0 then usub (toU lstart) (toU longMin) < toU lstep\n             else usub (toU longMax) (toU lstart) < usub 0 (toU lstep)) then slow\n    else\n      let ulen := getLenOfRange lstart lstop lstep\n      if ulen > longMax then slow\n      else\n        let newStop := wrap (lstart - lstep)\n        let newStart := wrap (uadd (toU newStop) (umul ulen (toU lstep)))\n        .fast newStart (wrap (-lstep)) ulen\n  | _, _, _ => slow\n\n/-! ## `PySlice_GetIndices` (C API) -/\n\n/-- Return value, pending exception and output parameters of a C call. -/\nstructure CIndices where\n  ret : Int\n  exc : Option PyExc\n  start : Int\n  stop : Int\n  step : Int\n  deriving Repr, DecidableEq, Inhabited\n\n/-- `PyLong_AsSsize_t` on an int: `-1` with `OverflowError` set on overflow. -/\ndef asSsizeC (v : Int) : Int × Option PyExc :=\n  if ssizeMin ≤ v ∧ v ≤ ssizeMax then (v, none) else (-1, some ssizeOverflow)\n\n/-- `PySlice_GetIndices(slice, length, &start, &stop, &step)`,\nsliceobject.c:186-216, for int-or-None parts. A later exception replaces an\nearlier one (`exc` is the one pending on return). -/\ndef sliceGetIndices (s : Slice) (length : Int) : CIndices :=\n  let (step, e1) := match s.step with\n    | none => ((1 : Int), (none : Option PyExc))\n    | some v => asSsizeC v\n  let (start, e2) := match s.start with\n    | none => (if step < 0 then length - 1 else 0, (none : Option PyExc))\n    | some v => let (x, e) := asSsizeC v; (if x < 0 then wrap (x + length) else x, e)\n  let (stop, e3) := match s.stop with\n    | none => (if step < 0 then -1 else length, (none : Option PyExc))\n    | some v => let (x, e) := asSsizeC v; (if x < 0 then wrap (x + length) else x, e)\n  let exc := e3 <|> e2 <|> e1\n  let ret : Int := if stop > length then -1 else if start ≥ length then -1 else if step = 0 then -1 else 0\n  ⟨ret, exc, start, stop, step⟩\n\nend PyLean.RangeSlice\n","lean/PyLean/Core.lean":"/-!\nShared vocabulary for CPython models.\n\n* A Python exception is a value of `PyExc`; a model function returns `Py α`.\n* Python `int` is Lean `Int` (or `Nat` where the source guarantees `>= 0`).\n  There is no wraparound in pure-Python code; C code that narrows to\n  `Py_ssize_t` must model that narrowing explicitly with `ssize`.\n* Loops are written with explicit fuel. Running out of fuel is reported as\n  `PyExc.modelFuel`, which never corresponds to Python behaviour, so properties\n  quantify over inputs where the source loop terminates.\n-/\n\nnamespace PyLean\n\n/-- Exception classes that models raise. The message is compared exactly\nby the differential tester, so models copy the source's format string. -/\ninductive PyExc where\n  | valueError (msg : String)\n  | typeError (msg : String)\n  | indexError (msg : String)\n  | keyError (msg : String)\n  | overflowError (msg : String)\n  | zeroDivisionError (msg : String)\n  | assertionError (msg : String)\n  | stopIteration\n  /-- A module-defined exception class, e.g. `ipaddress.NetmaskValueError`. -/\n  | named (cls : String) (msg : String)\n  /-- Not a Python exception: the model's loop fuel ran out. -/\n  | modelFuel\n  deriving Repr, DecidableEq, Inhabited\n\n/-- Name of the Python exception class, as `type(e).__name__` prints it. -/\ndef PyExc.className : PyExc → String\n  | .valueError _ => \"ValueError\"\n  | .typeError _ => \"TypeError\"\n  | .indexError _ => \"IndexError\"\n  | .keyError _ => \"KeyError\"\n  | .overflowError _ => \"OverflowError\"\n  | .zeroDivisionError _ => \"ZeroDivisionError\"\n  | .assertionError _ => \"AssertionError\"\n  | .stopIteration => \"StopIteration\"\n  | .named cls _ => cls\n  | .modelFuel => \"<model fuel exhausted>\"\n\ndef PyExc.message : PyExc → String\n  | .valueError m | .typeError m | .indexError m | .keyError m\n  | .overflowError m | .zeroDivisionError m | .assertionError m | .named _ m => m\n  | .stopIteration | .modelFuel => \"\"\n\n/-- Result of evaluating Python code: a value or a raised exception. -/\nabbrev Py (α : Type) := Except PyExc α\n\ninstance {α : Type} [DecidableEq α] : DecidableEq (Py α)\n  | .ok a, .ok b => if h : a = b then .isTrue (h ▸ rfl) else .isFalse (fun e => h (Except.ok.inj e))\n  | .error a, .error b => if h : a = b then .isTrue (h ▸ rfl) else .isFalse (fun e => h (Except.error.inj e))\n  | .ok _, .error _ => .isFalse (fun e => nomatch e)\n  | .error _, .ok _ => .isFalse (fun e => nomatch e)\n\n/-- `True` when the computation raised an exception of the given class. -/\ndef Py.raises {α : Type} (r : Py α) (cls : String) : Prop :=\n  ∃ e, r = .error e ∧ e.className = cls\n\n/-- `int.bit_length()` on a non-negative int. -/\ndef bitLength (n : Nat) : Nat := if n = 0 then 0 else Nat.log2 n + 1\n\n/-- Python `~a & b` for `a b >= 0`. Since `b` has no bits at or above\n`bit_length(b)`, complementing `a` within that width is exact. -/\ndef notAnd (a b : Nat) : Nat := ((2 ^ bitLength b - 1) ^^^ a) &&& b\n\n/-- `Py_ssize_t` on a 64-bit build. -/\ndef ssizeMin : Int := -(2 ^ 63)\ndef ssizeMax : Int := 2 ^ 63 - 1\n\nend PyLean\n"}}</script>
<script type="application/json" id="demo-tr">{"lean/PyLean/RangeSlice/Spec.lean":{"b1":{"id":"b1","title":"モジュール説明","math":"`range` の性質を述べるための数学的な用語を定める。第 $k$ 要素 $start + k\\cdot step$ と、割り算を使わずに特徴づけた長さ。\n\n$L$ が `range(start, stop, step)` の長さであるとは、添字 $0 \\le k < L$ のときにちょうど、要素が `step` の向きに見て `stop` より手前にある、ということ。","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"定義: InSeq（第 k 要素が stop より手前にある）","math":"整数 $start, stop, step, k$ に対して\n$$\\mathrm{InSeq}(start, stop, step, k) \\;:\\iff\\; \\begin{cases} start + k\\cdot step < stop & (0 < step)\\\\ stop < start + k\\cdot step & (\\text{それ以外})\\end{cases}$$\n$start + k\\cdot step$ が、`step` の向きに見て `stop` より手前にある（`stop` 自身は含まない）。","proof":"","lean":"`def … : Prop` は真偽値ではなく**命題**に名前を付ける定義。`if 0 < step then … else …` は命題の場合分けで、$step = 0$ は else 側に入るが、使う側で必ず $step \\ne 0$ を仮定するので問題にならない。","src":""},"b4":{"id":"b4","title":"定義: IsLen（L が range の長さである）","math":"$$\\mathrm{IsLen}(start, stop, step, L) \\;:\\iff\\; 0 \\le L \\;\\wedge\\; \\forall k \\ge 0,\\ \\bigl(k < L \\iff \\mathrm{InSeq}(start, stop, step, k)\\bigr)$$\n添字 $k \\ge 0$ のうち、要素 $start + k\\cdot step$ が stop より手前にあるのはちょうど $k = 0, 1, \\dots, L-1$ である、という長さの特徴づけ。割り算を使わないので、C の実装の式とは独立な「正解」として使える。これを満たす $L$ は高々 1 つ（`isLen_unique`）。","proof":"","lean":"`∀ k, 0 ≤ k → (…)` は「すべての整数 $k$ について、$k \\ge 0$ ならば …」。`↔` は同値、`∧` は「かつ」。","src":""},"b5":{"id":"b5","title":"定義: range の第 k 要素","math":"range オブジェクト $r$ と整数 $k$ に対して $r.\\mathrm{elem}(k) = r.start + k\\cdot r.step$。","proof":"","lean":"`Range.elem` は構造体 `Range`（Model.lean、フィールド start / stop / step / length）に付いた関数で、`r.elem k` と書ける（ドット記法）。$k$ は `Int` なので負の $k$ でも値はあるが、意味を持つのは $0 \\le k < L$ のとき。","src":""},"b6":{"id":"b6","title":"定義: Range.WF（rangeobject の型不変条件）","math":"$$r.\\mathrm{WF} \\;:\\iff\\; r.step \\ne 0 \\;\\wedge\\; r.length = \\mathrm{computeRangeLength}(r.start, r.stop, r.step)$$\nstep が 0 でなく、`length` フィールドには `compute_range_length` が計算した値が入っている。","proof":"","lean":"WF は well-formed の略。`computeRangeLength` は Model.lean の定義で、C の long での高速経路を試し、だめなら PyLong の低速経路を使う。","src":"`make_range_object`（rangeobject.c:66-88）が `length` に `compute_range_length` の結果を格納すること、step が `validate_step` で 0 を拒否される（あるいはスライスで非零 step 同士の積になる）ことに対応。"},"b7":{"id":"b7","title":"定義: r の数学的な長さ","math":"$r.\\mathrm{Len}(L) :\\iff \\mathrm{IsLen}(r.start, r.stop, r.step, L)$。\n\nC 側が計算して格納した `r.length` とは別に、数学的に正しい長さを述語として与えている。両者が一致することを Length.lean で証明する。","proof":"","lean":"","src":""},"b8":{"id":"b8","title":"定義: x は（長さ L の）r の要素である","math":"$$r.\\mathrm{MemL}(L, x) \\;:\\iff\\; \\exists k,\\ 0 \\le k \\;\\wedge\\; k < L \\;\\wedge\\; x = r.start + k\\cdot r.step$$","proof":"","lean":"`∃ k, …` は存在量化。長さを引数 $L$ として受け取る形なので、使う側で `r.Len L` と組み合わせる。","src":""}},"lean/PyLean/RangeSlice/Length.lean":{"b1":{"id":"b1","title":"モジュール説明","math":"range の長さについて次を示す。\n\n- unsigned long で計算する高速経路 `get_len_of_range` は、PyLong で計算する低速経路 `compute_range_length` と一致する。\n- どちらも、任意の Python 整数に対して数学的な長さを計算する。\n- `len()` は、その長さが `sys.maxsize` を超えるときに限って `OverflowError` を送出する。","proof":"","lean":"","src":""},"b3":{"id":"b3","title":"見出し: 算術の補題","math":"","proof":"","lean":"","src":""},"b4":{"id":"b4","title":"補題: 条件が真なら if は then 側の値","math":"決定可能な命題 $c$ と値 $a, b$ について、$c$ が成り立つなら $(\\text{if } c \\text{ then } a \\text{ else } b) = a$。","proof":"仮定 $h : c$ を使って `simp` で書き換えるだけ。","lean":"`[Decidable c]` は「$c$ の真偽を計算で決められる」というインスタンス引数で、`if` を書くのに必要。`{α : Sort _}` は暗黙の型引数。以降の証明で `rw [ite_t h]` として if を外すための小道具。","src":""},"b5":{"id":"b5","title":"補題: 条件が偽なら if は else 側の値","math":"決定可能な命題 $c$ について、$\\neg c$ なら $(\\text{if } c \\text{ then } a \\text{ else } b) = b$。","proof":"`simp [h]`。","lean":"","src":""},"b6":{"id":"b6","title":"定理: 長さは一意に決まる","math":"$\\mathrm{IsLen}(a, b, s, L_1)$ かつ $\\mathrm{IsLen}(a, b, s, L_2)$ ならば $L_1 = L_2$。","proof":"三分律で $L_1 < L_2$、$L_1 = L_2$、$L_1 > L_2$ に分ける。$L_1 < L_2$ なら $k = L_1$ は $k < L_2$ を満たすので、$L_2$ の定義から $\\mathrm{InSeq}(k)$ が成り立つ。すると $L_1$ の定義から $k < L_1$、つまり $L_1 < L_1$ となって矛盾。$L_1 > L_2$ も対称。","lean":"`obtain ⟨h₁0, h₁⟩ := h₁` は「かつ」を 2 つの仮定に分解する。`omega` は整数・自然数の線形算術を自動で解くタクティク。","src":""},"b7":{"id":"b7","title":"定理: 低速経路は数学的な長さを計算する","math":"$s \\ne 0$ ならば $\\mathrm{IsLen}(a, b, s, \\mathrm{computeRangeLengthSlow}(a, b, s))$。ここで\n$$\\mathrm{computeRangeLengthSlow}(a,b,s) = \\begin{cases} 0 & s>0,\\ a \\ge b\\\\ \\left\\lfloor \\dfrac{b-a-1}{s} \\right\\rfloor + 1 & s>0,\\ a<b\\\\ 0 & s<0,\\ b \\ge a\\\\ \\left\\lfloor \\dfrac{a-b-1}{-s} \\right\\rfloor + 1 & s<0,\\ a>b \\end{cases}$$","proof":"定義を展開し、$s>0$ / $s<0$ と空かどうかの 4 通りに場合分けする。空の場合は $L = 0$ で、どの $k \\ge 0$ でも要素が stop を越えている（$a + ks \\ge b$、あるいはその逆向き）ことを示す。空でない場合は $q = \\lfloor (b-a-1)/s \\rfloor$ とおき、$k \\le q \\iff ks \\le b-a-1$（`Int.le_ediv_iff_mul_le`）から $k < q+1 \\iff a + ks < b$ を導く。最後は `omega`。","lean":"`/` は `Int.ediv`。除数が正なら床関数 $\\lfloor\\cdot\\rfloor$ と同じ（C の切り捨て除算とは負の数で異なる）。`ite_t` / `ite_f` で if を外しながら進めている。","src":""},"b8":{"id":"b8","title":"定理: unsigned long 版 get_len_of_range は PyLong 版の式と一致する","math":"$lo, hi, step$ がすべて C の `long` の範囲 $[-2^{63}, 2^{63}-1]$ にあり、$step \\ne 0$ ならば\n$$\\mathrm{getLenOfRange}(lo, hi, step) = \\mathrm{computeRangeLengthSlow}(lo, hi, step).$$\n左辺は $2^{64}$ を法とする符号なし演算で、たとえば $step > 0,\\ lo < hi$ なら $\\Bigl(1 + \\bigl\\lfloor \\bigl((hi - 1 - lo) \\bmod 2^{64}\\bigr) / step \\bigr\\rfloor\\Bigr) \\bmod 2^{64}$ を計算する。","proof":"「$step>0$ かつ $lo<hi$」「$step<0$ かつ $lo>hi$」「それ以外」の 3 通りに分ける。前の 2 つでは、long の範囲という仮定から $0 \\le hi - lo - 1 < 2^{64}$ なので符号なし減算が折り返さない（結果がそのまま $hi - lo - 1$）ことを示す。商は非負かつ被除数以下なので、最後の $1 + q$ も $2^{64}$ 未満で折り返さない。ここまで `omega`。「それ以外」では両辺とも 0。","lean":"`toU x = x % 2^64`、`usub` / `uadd` は mod $2^{64}$ の減算・加算（Model.lean）。`%` は `Int.emod` なので結果は常に $[0, 2^{64})$ に入る。$step < 0$ のときの $-step$ は `usub 0 (toU step)` で表している。","src":"CPython の `get_len_of_range`（rangeobject.c:992-1014）の unsigned long 算術。"},"b9":{"id":"b9","title":"見出し: 性質","math":"","proof":"","lean":"","src":""},"b10":{"id":"b10","title":"性質（命題の定義）: 高速経路と低速経路の一致","math":"$$\\forall\\, start, stop, step, len \\in \\mathbb{Z},\\quad step \\ne 0 \\;\\wedge\\; \\mathrm{computeRangeLengthLong}(start, stop, step) = \\mathrm{some}(len) \\;\\Longrightarrow\\; len = \\mathrm{computeRangeLengthSlow}(start, stop, step)$$\nC の `long` の高速経路が長さを返したなら、それは PyLong の低速経路の値と等しい。","proof":"","lean":"`def … : Prop` で性質に名前を付け、証明は次の `…_proven` で与えるのがこのリポジトリの流儀（Registry に登録される）。`some len` は Option 型で「値 len がある」、`none` は高速経路が長さを返さない（オーバーフロー）場合。","src":"高速経路 `compute_range_length_long`（rangeobject.c:202-236）と PyLong 低速経路（rangeobject.c:273-315）。前提 $step \\ne 0$ は、`get_len_of_range` の assert と `validate_step` で保証される事前条件。"},"b11":{"id":"b11","title":"定理: RangeLengthFastSlow は成り立つ","math":"直前の命題 `RangeLengthFastSlow` の証明。","proof":"`computeRangeLengthLong` を展開すると、3 引数がすべて long に収まり、かつ得られた長さが `LONG_MAX` 以下のときだけ `some (getLenOfRange …)` を返す。3 つの `IsLong` で場合分けし、収まらない場合は `none` なので仮定と矛盾。収まる場合は `getLenOfRange_eq` に帰着する。","lean":"`<;>` は直前のタクティクで生じたすべてのゴールに同じタクティクを適用する。`obtain ⟨-, rfl⟩ := h` は不要な成分を捨て、等式を代入して消す。","src":""},"b12":{"id":"b12","title":"定理: compute_range_length は常に低速経路の値と等しい","math":"$step \\ne 0$ ならば $\\mathrm{computeRangeLength}(start, stop, step) = \\mathrm{computeRangeLengthSlow}(start, stop, step)$。","proof":"`computeRangeLength` は、高速経路が `some len` を返せば len、`none` なら低速経路の値。前者は `rangeLengthFastSlow_proven`、後者は定義そのまま（`rfl`）。","lean":"`split` は match の分岐ごとにゴールを分ける。`rfl` は両辺が定義から等しいことを示す。","src":""},"b13":{"id":"b13","title":"系: compute_range_length は数学的な長さ","math":"$step \\ne 0$ ならば $\\mathrm{IsLen}(start, stop, step, \\mathrm{computeRangeLength}(start, stop, step))$。","proof":"直前の定理で低速経路の値に書き換え、`slow_isLen` を使う。","lean":"","src":""},"b14":{"id":"b14","title":"系: WF な range の length フィールドは数学的な長さ","math":"$r.\\mathrm{WF}$ ならば $r.\\mathrm{Len}(r.length)$。","proof":"WF の第 2 成分 $r.length = \\mathrm{computeRangeLength}(\\dots)$ で書き換え、第 1 成分 $r.step \\ne 0$ を使って `computeRangeLength_isLen` を適用する。","lean":"名前が `Range.WF.len` なので、`h : r.WF` に対して `h "WF な range $r$ とその数学的な長さ $L$（$r.\\mathrm{Len}(L)$）について\n$$\\mathrm{rangeLength}(r) = \\begin{cases} \\mathrm{ok}(L) & L \\le \\mathtt{ssizeMax} \\\\ \\mathrm{error}(\\texttt{OverflowError}) & \\text{それ以外} \\end{cases}$$\nここで $\\mathtt{ssizeMax} = 2^{63} - 1$（64 ビット環境の `sys.maxsize`）。","proof":"","lean":"`ssizeOverflow` は `OverflowError(\"Python int too large to convert to C ssize_t\")`。`r.WF` は型不変条件として仮定している。","src":"Python ドキュメント（Doc/builtins/stdtypes.rst:1817-1819）の「`sys.maxsize` より大きな絶対値を含む range は作れるが、`len()` などは `OverflowError` を送出しうる」という記述に対応。"},"b22":{"id":"b22","title":"定理: LenOverflow は成り立つ","math":"直前の命題 `LenOverflow` の証明。","proof":"`Range.WF.length_eq` で $r.length = L$ に書き換えれば、あとは `rangeLength` の定義そのもの（`rfl`）。","lean":"","src":""},"b23":{"id":"b23","title":"性質（命題の定義）: すべての長さ計算経路が正確","math":"次の 4 つの連言。\n\n1. $lo, hi, step$ がすべて long に収まり $step \\ne 0$ なら、$\\mathrm{IsLen}(lo, hi, step, \\mathrm{getLenOfRange}(lo, hi, step))$。\n2. $step \\ne 0$ かつ $\\mathrm{IsLen}(start, stop, step, L)$ なら、$\\mathrm{computeRangeLengthLong}(start, stop, step)$ は「3 引数がすべて long に収まり $L \\le \\mathtt{longMax}$」のとき $\\mathrm{some}(L)$、そうでなければ $\\mathrm{none}$。\n3. $step \\ne 0$ なら $\\mathrm{IsLen}(start, stop, step, \\mathrm{computeRangeLengthSlow}(start, stop, step))$。\n4. $step \\ne 0$ なら $\\mathrm{IsLen}(start, stop, step, \\mathrm{computeRangeLength}(start, stop, step))$。","proof":"","lean":"`IsLen` が値を一意に決めるので、大きな引数で 0 を返す低速経路や `ULONG_MAX` を返す `get_len_of_range` のような誤った実装はこの性質を満たせない、とコメントにある。命題を弱めずに「正しさ」を捉えるための書き方。","src":"`get_len_of_range`（rangeobject.c:992-1014）、`compute_range_length_long`（:202-236）、PyLong 低速経路（:273-315）、`compute_range_length`（:243-323）。"},"b24":{"id":"b24","title":"定理: RangeLengthExact は成り立つ","math":"直前の命題 `RangeLengthExact` の証明。","proof":"4 つを順に示す。(1) `getLenOfRange_eq` で低速経路に書き換えて `slow_isLen`。(2) 一意性 `isLen_unique` で $L$ を低速経路の値に置き換え、3 つの `IsLong` と $L \\le \\mathtt{longMax}$ で場合分けして定義を計算する。(3) `slow_isLen`。(4) `computeRangeLength_isLen`。","lean":"", <script>
// ---- core: Lean block splitting, naming, identifier index, prompt building ----
// Pure functions (no DOM). Tested with node.

const STARTER_KW = new Set(("theorem lemma def abbrev structure inductive coinductive class instance axiom axioms opaque " +
  "example namespace section end open variable universe import set_option attribute macro macro_rules syntax " +
  "notation infix infixl infixr prefix postfix elab elab_rules declare_syntax_cat initialize builtin_initialize " +
  "mutual export omit include module irreducible_def register_simp_attr add_decl_doc alias private protected " +
  "noncomputable partial unsafe nonrec local scoped public meta deriving").split(/\s+/));
const STRUCT_KW = new Set("namespace section end open universe import set_option export omit include module mutual".split(" "));
const MODIFIERS = new Set("private protected noncomputable partial unsafe nonrec public meta local scoped".split(" "));
const DECL_KW = ["theorem", "lemma", "def", "abbrev", "structure", "inductive", "coinductive", "class", "instance",
  "axiom", "opaque", "example", "irreducible_def", "variable", "macro", "macro_rules", "syntax", "notation", "infix",
  "infixl", "infixr", "prefix", "postfix", "elab", "elab_rules", "attribute", "alias", "deriving", "initialize",
  "declare_syntax_cat", "register_simp_attr", "add_decl_doc"];

function isStarterLine(line) {
  if (!line || /^\s/.test(line)) return false;
  if (line.startsWith("@[") || line.startsWith("/-") || line.startsWith("--")) return true;
  if (/^#[a-z_]+/.test(line)) return true;
  const m = /^([A-Za-z_]+)\b/.exec(line);
  if (!m) return false;
  if (m[1] === "deriving") return /^deriving\s+instance\b/.test(line);
  return STARTER_KW.has(m[1]);
}

// Scan one line, updating {depth, inStr}. Returns the state after the line.
function scanLine(line, st) {
  let depth = st.depth, inStr = st.inStr;
  for (let i = 0; i < line.length; i++) {
    const c = line[i], n = line[i + 1];
    if (inStr) {
      if (c === "\\") { i++; continue; }
      if (c === '"') inStr = false;
      continue;
    }
    if (depth > 0) {
      if (c === "/" && n === "-") { depth++; i++; }
      else if (c === "-" && n === "/") { depth--; i++; }
      continue;
    }
    if (c === "-" && n === "-") break; // line comment
    if (c === "/" && n === "-") { depth++; i++; continue; }
    if (c === '"') { inStr = true; continue; }
    if (c === "'") { // char literal like '"' or '\n' (but not h' identifiers)
      const prev = line[i - 1] || " ";
      if (!/[A-Za-z0-9_'!?Ͱ-Ͽ₀-ₜ]/.test(prev)) {
        if (n === "\\" && line[i + 3] === "'") { i += 3; continue; }
        if (line[i + 2] === "'") { i += 2; continue; }
      }
    }
  }
  return { depth, inStr };
}

function stripLeading(text) {
  // remove docstring /-- ... -/ , attributes @[...], and line comments at the start
  let t = text;
  for (let guard = 0; guard < 50; guard++) {
    const before = t;
    t = t.replace(/^\s+/, "");
    if (t.startsWith("/--") || (t.startsWith("/-") && !t.startsWith("/-!"))) {

      for (; i < t.length; i++) {

    } else if (t.startsWith("@[")) {

// Split Lean source into blocks.

    else if ((first.startsWith("/--") || first.startsWith("@[") || first.startsWith("--")) && rest === "") c.cls = "lead";

    }
    const prev = merged[merged.length - 1];

    if (!ls.length) return;
    const text = ls.join("\n");

}

// Where the statement of a declaration ends (before the proof / body).
function statementPart(text) {

    if (st.depth === 0 && i > 0 && /^\s*(\||where\b)/.test(l) && !/:=/.test(out.join("\n"))) { return out.join("\n"); }

      if (c === '"') { s2.inStr = true; continue; }

      if (d > 0) { if (c === "/" && n === "-") { d++; j++; } else if (c === "-" && n === "/") { d--; j++; } continue; }

      if (c === "/" && n === "-") { d++; j++; continue; }

// Index of declarations: key (full name and each dotted suffix) -> [{path, block}]
function buildIndex(files /* [{path, blocks}] */) {

      const arr = idx.get(key);
      if (!arr.some(e => e.path === f.path && e.block.id === b.id)) arr.push({ path: f.path, block: b });

function lookupIdent(idx, tok) {

// Collect context: definitions referenced by `blocks` (current file) from other indexed files.
function collectContext(curPath, curBlocks, idx, budget = 24000) {

  const picked = new Map(); // key path#id -> {path, block}

    const found = [];
    for (const t of tokSet) {
      const hits = lookupIdent(idx, t);

      for (const h of hits) {

        const key = h.path + "#" + h.block.id;

function fileWithMarkers(blocks) {

// Group blocks for translation into chunks

const STYLE_TEXT = {

Translate each requested block into natural-language mathematics written in ${lang}.

Repository: ${repoLabel}
File: ${path}

For each requested block return one JSON object with these string fields:

- "title": one short line in ${lang} saying what the block is ("Definition: ...", "Theorem: ...", etc.).

${fileSection}
</file>

{"id":"b3","title":"…","math":"…","proof":"","lean":"","src":""}`;

function renderRich(src) {
  if (!src) return "";
  const ph = [];
  const hold = html => { ph.push(html); return `\u0000${ph.length - 1}\u0000`; };
  let s = String(src);
  s = s.replace(/`([^`\n]+)`/g, (_, c) => hold(`<code>${esc(c)}</code>`));
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => hold(`<div class="dm">${renderMath(m.trim(), true)}</div>`));
  s = s.replace(/\\\[([\s\S]+?)\\\]/g, (_, m) => hold(`<div class="dm">${renderMath(m.trim(), true)}</div>`));
  s = s.replace(/(^|[^\\])\$([^$\n]+?)\$/g, (_, pre, m) => pre + hold(renderMath(m, false)));
  s = s.replace(/\\\(([\s\S]+?)\\\)/g, (_, m) => hold(renderMath(m, false)));
  s = esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const paras = s.split(/\n\s*\n/);
  const html = paras.map(p => {
    const lines = p.split("\n");

    if (lines.every(l => isUl(l) || !l.trim())) return "<ul>" + lines.filter(l => l.trim()).map(l => `<li>${l.replace(/^\s*([-*・•])\s+/, "")}</li>`).join("") + "</ul>";
    if (lines.every(l => isOl(l) || !l.trim())) return "<ol>" + lines.filter(l => l.trim()).map(l => `<li>${l.replace(/^\s*\d+[.)]\s+/, "")}</li>`).join("") + "</ol>";
    const h = /^#{1,4}\s+(.*)$/.exec(p.trim());
    if (h && lines.length === 1) return `<p class="h">${h[1]}</p>`;
    // mixed: lines before a list then list
    let out = "", buf = [], list = [];
    const flush = () => { if (buf.length) { out += `<p>${buf.join("<br>")}</p>`; buf = []; } if (list.length) { out += "<ul>" + list.map(x => `<li>${x}</li>`).join("") + "</ul>"; list = []; } };
    for (const l of lines) { if (isUl(l)) { if (buf.length) { out += `<p>${buf.join("<br>")}</p>`; buf = []; } list.push(l.replace(/^\s*([-*・•])\s+/, "")); } else { if (list.length) flush(); if (l.trim()) buf.push(l); } }
    flush();
    return out;
  }).join("");
  return html.replace(/\u0000(\d+)\u0000/g, (_, i) => ph[+i]);
}

function hlLean(text) {
  // returns array of html lines
  const lines = text.split("\n");
  let depth = 0, inStr = false;
  const out = [];
  const symRe = /^(<;>|:=|←|→|↔|∀|∃|¬|∧|∨|≠|≤|≥|⟨|⟩|↑|∘|×|·|\^\^\^|&&&|\|\|\||\?_|%|\/)/;
  for (const l of lines) {
    let h = "", i = 0;
    while (i < l.length) {
      const c = l[i], n = l[i + 1];
      if (inStr) { let j = i; while (j < l.length && l[j] !== '"') { if (l[j] === "\\") j++; j++; } h += `<span class="s">${esc(l.slice(i, Math.min(j + 1, l.length)))}</span>`; if (j < l.length) inStr = false; i = j + 1; continue; }
      if (depth > 0 || (c === "/" && n === "-")) {
        let j = i, d = depth;
        while (j < l.length) { if (l[j] === "/" && l[j + 1] === "-") { d++; j += 2; continue; } if (l[j] === "-" && l[j + 1] === "/") { d--; j += 2; if (d === 0) break; continue; } j++; }
        h += `<span class="c">${esc(l.slice(i, j))}</span>`; depth = d; i = j; continue;
      }
      if (c === "-" && n === "-") { h += `<span class="c">${esc(l.slice(i))}</span>`; break; }
      if (c === '"') { inStr = true; let j = i + 1; while (j < l.length && l[j] !== '"') { if (l[j] === "\\") j++; j++; } h += `<span class="s">${esc(l.slice(i, Math.min(j + 1, l.length)))}</span>`; if (j < l.length) inStr = false; i = j + 1; continue; }
      const m = /^[A-Za-z_α-κμ-ωΑ-Ω][A-Za-z0-9_'!?α-ωΑ-Ω₀-₉]*(?:\.[A-Za-z_α-ωΑ-Ω][A-Za-z0-9_'!?α-ωΑ-Ω₀-₉]*)*/.exec(l.slice(i));
      if (m && !/[A-Za-z0-9_']/.test(l[i - 1] || "")) {
        const w = m[0];
        const cls = KW.has(w) ? "k" : TACTIC.has(w) ? "t" : TYPES.has(w) ? "ty" : "i";
        h += `<span class="${cls} tok" data-t="${esc(w)}">${esc(w)}</span>`; i += w.length; continue;
      }
      const nm = /^\d+/.exec(l.slice(i));
      if (nm && !/[A-Za-z_]/.test(l[i - 1] || "")) { h += `<span class="n">${nm[0]}</span>`; i += nm[0].length; continue; }

      if (sm) { h += `<span class="y tok" data-t="${esc(sm[0])}">${esc(sm[0])}</span>`; i += sm[0].length; continue; }
      if (c === "λ") { h += `<span class="k tok" data-t="λ">λ</span>`; i++; continue; }
      h += esc(c); i++;
    }
    out.push(h || " ");
  }
  return out;
}

function buildTree() {

async function loadImports(p, maxFiles = 30, maxDepth = 3) {

      for (const mod of CORE.importsOf(tx)) {

        if (!mp || seen.has(mp)) continue;

      }
      if (count >= maxFiles) break;
    }
    await Promise.all(next.map(async f => { try { indexFile(f, await blocksOf(f)); } catch (e) { } }));

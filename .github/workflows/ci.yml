name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test "test/*.test.cjs"
      - name: Built files match the sources
        run: |
          python3 tools/build.py
          git diff --exit-code -- public dist
